# envoy ServiceAccount (per v0.44 §14.12 III envoy 容器化实施)
# 跟其他 svc 一致 (per brief §3.1 5 文件结构)
# 选型: envoy 独立 deployment (per 9/1 13:03 JST 用户拍板"所有 nginx → envoy" + 13:05 JST 拍板"独立部署, not istio sidecar")
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envoy
  namespace: star-system
  labels:
    app: envoy
    app.kubernetes.io/name: envoy
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: star-system
    app.kubernetes.io/version: "1.31.0"
    star.agent/inject: "false"  # 显式拒绝 sidecar 自动注入 (per 9/1 13:05 JST 拍板)
