# envoy bootstrap config (per v0.44 §14.12 III envoy 容器化实施 + v0.71 §14.12 IV 业务路由 + TLS 自动签发)
#
# v0.71 业务路由 (per WBS §14.10.4 缺口 #4 + v0.62 反转解锁 Mavis 推进):
# - 5 业务路由: /api/v1/*, /oauth/*, /mcp/*, /ws/*, /actuator/*
# - 3 集群: star_api_rest_cluster, star_mcp_cluster, star_ops_cluster
# - 保留 readiness listener (per brief §1)
#
# 守门 #5 v2: bootstrap config 不含 secret, cert 在 file_system_http filter 阶段挂载 (per v0.71+ cert-manager)
# 选型: envoyproxy/envoy:v1.31.0 (官方 upstream image)
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-bootstrap
  namespace: star-system
  labels:
    app: envoy
    app.kubernetes.io/name: envoy
    app.kubernetes.io/component: config
data:
  # envoy.yaml - bootstrap config (v0.71 5 业务路由 + 3 集群)
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 15001

    # layer: HTTP connection manager (per spec §4 业务路由层)
    static_resources:
      listeners:
        - name: readiness_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 15090
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: readiness
                    route_config:
                      name: readiness_routes
                      virtual_hosts:
                        - name: readiness_vhost
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/ready"
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "OK\n"
                            - match:
                                prefix: "/healthz"
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "OK\n"
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        # v0.71 业务入口 listener (port 8443, TLS cert-manager 自动签发, per v0.71+)
        - name: star_https_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8443
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificate_sds_secret_configs:
                      - name: star_tls_cert
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: sds_cluster
                            set_node_on_first_message_only: true
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: star_https
                    route_config:
                      name: star_routes
                      virtual_hosts:
                        - name: star_vhost
                          domains: ["star.local", "api.star.local", "mcp.star.local", "*"]
                          routes:
                            # /api/v1/* → star_api_rest (v0.45 5 业务表 API)
                            - match:
                                prefix: "/api/v1/"
                              route:
                                cluster: star_api_rest_cluster
                                timeout: 30s
                                # 跨域编排: 重试 + 熔断 (per spec §4.2)
                                retry_policy:
                                  retry_on: "5xx,reset,connect-failure"
                                  num_retries: 3
                                  per_try_timeout: 5s
                            # /oauth/* → star_api_rest (v0.43 OAuth2 server)
                            - match:
                                prefix: "/oauth/"
                              route:
                                cluster: star_api_rest_cluster
                                timeout: 10s
                            # /mcp/* → star_mcp (MCP server 16 tool)
                            - match:
                                prefix: "/mcp/"
                              route:
                                cluster: star_mcp_cluster
                                timeout: 60s
                            # /ws/* → star_api_rest (WebSocket)
                            - match:
                                prefix: "/ws/"
                              route:
                                cluster: star_api_rest_cluster
                                timeout: 0s  # WebSocket 长连接
                                upgrade_configs:
                                  - upgrade_type: "websocket"
                            # /actuator/* → star_ops (监控 + health)
                            - match:
                                prefix: "/actuator/"
                              route:
                                cluster: star_ops_cluster
                                timeout: 5s
                            # 默认 catch-all 404
                            - match:
                                prefix: "/"
                              direct_response:
                                status: 404
                                body:
                                  inline_string: "Not Found\n"
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      # 1 SDS cluster (Secret Discovery Service, per cert-manager 自动签发 TLS cert, v0.71+)
      # + v0.71 3 业务集群 — 必须同一个 clusters 列表 (YAML 同 key 重复第二份会覆盖第一份,
      # 导致 star_https_listener TLS 引用的 sds_cluster 在生效配置里消失, per 2026-09-16 review)
      clusters:
        - name: sds_cluster
          connect_timeout: 5s
          type: STRICT_DNS
          load_assignment:
            cluster_name: sds_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: secret-discovery-service
                          port_value: 8081

        - name: star_api_rest_cluster
          connect_timeout: 5s
          type: STRICT_DNS
          load_assignment:
            cluster_name: star_api_rest_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: star-api-rest
                          port_value: 8081
          # 连接池配置 (per spec §4.3)
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 1024
                max_pending_requests: 1024
                max_requests: 1024
                max_retries: 3
          health_checks:
            - timeout: 1s
              interval: 5s
              unhealthy_threshold: 3
              healthy_threshold: 1
              http_health_check:
                path: "/healthz"

        - name: star_mcp_cluster
          connect_timeout: 5s
          type: STRICT_DNS
          load_assignment:
            cluster_name: star_mcp_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: star-mcp
                          port_value: 3000
          health_checks:
            - timeout: 1s
              interval: 5s
              unhealthy_threshold: 3
              healthy_threshold: 1
              http_health_check:
                path: "/ready"

        - name: star_ops_cluster
          connect_timeout: 5s
          type: STRICT_DNS
          load_assignment:
            cluster_name: star_ops_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: star-ops
                          port_value: 8082
          health_checks:
            - timeout: 1s
              interval: 5s
              unhealthy_threshold: 3
              healthy_threshold: 1
              http_health_check:
                path: "/ready"
