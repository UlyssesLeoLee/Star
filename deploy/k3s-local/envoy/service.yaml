# envoy Service (per v0.44 §14.12 III envoy 容器化实施, brief §3.1 service.yaml)
# ClusterIP service (per brief §3.1), port 15001 (admin) + 15090 (readiness) + 8443 (https, v0.71+)
# future: business listener port 15000 跨 session 续 (http, envoy 目前只有 https listener)
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: star-system
  labels:
    app: envoy
    app.kubernetes.io/name: envoy
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: star-system
spec:
  type: ClusterIP  # 独立 deployment, 不走 ingress (per 9/1 13:05 JST 拍板"独立部署, not istio sidecar")
  selector:
    app: envoy
  ports:
    # admin port (per brief §1 已知)
    - name: admin
      port: 15001
      targetPort: admin
      protocol: TCP
    # readiness port (per brief §1 已知)
    - name: readiness
      port: 15090
      targetPort: readiness
      protocol: TCP
    # https 业务入口 (per v0.71 §14.12 IV, deployment.yaml containerPort "https" = 8443;
    # 之前这段一直被注释掉, 导致 /api/v1 /oauth /mcp /ws /actuator 5 条业务路由虽然在
    # envoy 内部配了, 但 Service 不转发 8443, 集群内没有任何入口能打到它们, per 2026-09-16 review)
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
    # future: business http listener 跨 session 续 (per brief §6 已知缺口, envoy 侧目前
    # 只有 star_https_listener, 没有对应的 http listener, 所以这里先不开 http port)
    # - name: http
    #   port: 15000
    #   targetPort: http
    #   protocol: TCP
