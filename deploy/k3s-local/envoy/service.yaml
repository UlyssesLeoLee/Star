# envoy Service (per v0.44 §14.12 III envoy 容器化实施, brief §3.1 service.yaml)
# ClusterIP service (per brief §3.1), port 15001 (admin) + 15090 (readiness)
# future: business listener port 15000 / 8443 跨 session 续
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: star-system
  labels:
    app: envoy
    app.kubernetes.io/name: envoy
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: star-system
spec:
  type: ClusterIP  # 独立 deployment, 不走 ingress (per 9/1 13:05 JST 拍板"独立部署, not istio sidecar")
  selector:
    app: envoy
  ports:
    # admin port (per brief §1 已知)
    - name: admin
      port: 15001
      targetPort: admin
      protocol: TCP
    # readiness port (per brief §1 已知)
    - name: readiness
      port: 15090
      targetPort: readiness
      protocol: TCP
    # future: business listener 跨 session 续 (per brief §6 已知缺口)
    # - name: http
    #   port: 15000
    #   targetPort: http
    #   protocol: TCP
    # - name: https
    #   port: 8443
    #   targetPort: https
    #   protocol: TCP
