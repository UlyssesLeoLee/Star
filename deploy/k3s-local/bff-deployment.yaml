---
# BFF envoy 独立 deployment (per 9/1 13:05 JST 偏好, 0 istio sidecar)
# 0 istio 控制面 + 0 sidecar 自动注入
# 业务 svc 通过 svc://bff 引用
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-envoy
  namespace: star
  labels:
    app: bff-envoy
    component: edge-proxy
    app.kubernetes.io/name: bff-envoy
    app.kubernetes.io/component: edge-proxy
    app.kubernetes.io/part-of: star
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-envoy
  template:
    metadata:
      labels:
        app: bff-envoy
        component: edge-proxy
        app.kubernetes.io/name: bff-envoy
        app.kubernetes.io/component: edge-proxy
        app.kubernetes.io/part-of: star
      annotations:
        # 显式 0 istio sidecar 注入 (per 9/1 13:05 JST 用户偏好)
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          imagePullPolicy: IfNotPresent
          args:
            - "/usr/local/bin/envoy"
            - "--config-path"
            - "/etc/envoy/envoy.yaml"
            - "--log-level"
            - "info"
            - "--service-cluster"
            - "bff-envoy-star"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9901
              name: admin
          env:
            - name: ENVOY_LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: bff-envoy-config
            items:
              - key: envoy.yaml
                path: envoy.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: bff-envoy
  namespace: star
  labels:
    app: bff-envoy
    component: edge-proxy
spec:
  type: ClusterIP
  selector:
    app: bff-envoy
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: admin
      port: 9901
      targetPort: 9901
---
# 业务 BFF svc (Rust axum + tokio 1.40, port 3000)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: star
  labels:
    app: bff
    component: bff-runtime
    app.kubernetes.io/name: bff
    app.kubernetes.io/component: bff-runtime
    app.kubernetes.io/part-of: star
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
        component: bff-runtime
        app.kubernetes.io/name: bff
        app.kubernetes.io/component: bff-runtime
        app.kubernetes.io/part-of: star
      annotations:
        # 显式 0 istio sidecar 注入 (per 9/1 13:05 JST 用户偏好)
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: bff
          # 阶段 1 占位镜像, 阶段 4 实装阶段换成 ghcr.io/ulysses-star/bff:0.1.0
          image: bff:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: RUST_LOG
              value: info
            - name: BIND_ADDR
              value: "0.0.0.0:3000"
            - name: RUST_BACKTRACE
              value: "1"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: star
  labels:
    app: bff
    component: bff-runtime
spec:
  type: ClusterIP
  selector:
    app: bff
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# envoy config (per 9/1 13:05 JST 偏好, 业务 svc 通过 svc:// 引用)
apiVersion: v1
kind: ConfigMap
metadata:
  name: bff-envoy-config
  namespace: star
  labels:
    app: bff-envoy
    component: edge-proxy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

    static_resources:
      listeners:
        - name: bff_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: bff_ingress
                    route_config:
                      name: bff_route
                      virtual_hosts:
                        - name: bff_service
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/bff/v1/ws/"
                              route:
                                cluster: bff_cluster
                                upgrade_configs:
                                  - upgrade_type: websocket
                                    enabled: true
                            - match:
                                prefix: "/"
                              route:
                                cluster: bff_cluster
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: bff_cluster
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: bff_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: bff.star.svc.cluster.local
                          port_value: 80
