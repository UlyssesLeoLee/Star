# v0.89 P0-4 Stage 3.5 = platform_admin PostgreSQL password k8s Secret template
# (per v0.88 已知缺口 (b) 'PASSWORD 占位需 env 替换' 跨 session 续做)
#
# **重要**: P0-4 阶段这是 template, P2 阶段 worker 子代理用 sealed-secrets controller
# 生成实际 SealedSecret (per bitnami-labs/sealed-secrets 守门 #5 v2 env 安全)
#
# 守门 #5 v2 env 安全: 任何 password 都不入 git, 走 k8s Secret + sealed-secrets 加密
# 守门 #11 缺标比错标: P0-4 阶段 template 声明, P2 阶段 worker 子代理实测生成
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-admin-db-password
  namespace: star-system
  labels:
    app: star-pg-adapter
    component: platform-admin
    managed-by: mavis
    per-v0.89: "true"
  annotations:
    description: "v0.88 PLATFORM_ADMIN role PostgreSQL password (per v0.88 Stage 3.4 + v0.89 Stage 3.5 PASSWORD 占位 k8s Secret 实装)"
    generated-by: "scripts/secrets/platform_admin_password_gen.py (P2 阶段跑)"
    rotation-policy: "90d 自动轮换, per ADR-0043 + 守门 #5 v2"
type: Opaque
stringData:
  # P0-4 阶段: 'CHANGE_ME_AT_DEPLOY' 占位 (per v0.88 守门 #5 v2)
  # P2 阶段: 走 scripts/secrets/platform_admin_password_gen.py 生成 32 字节随机 password 替换
  # 守门 #5 v2: password 永远不入 git, 走 sealed-secrets 加密
  password: "CHANGE_ME_AT_DEPLOY"

---
