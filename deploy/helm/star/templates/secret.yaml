{{- if .Values.secrets.githubToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "star.name" . }}-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  GITLAB_TOKEN: {{ .Values.secrets.gitlabToken | quote }}
  BITBUCKET_APP_PASSWORD: {{ .Values.secrets.bitbucketAppPassword | quote }}
  GITEA_TOKEN: {{ .Values.secrets.giteaToken | quote }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
{{- end }}
