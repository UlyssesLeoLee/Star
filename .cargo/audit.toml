# cargo-audit 配置 (WBS 10.2.3, 2026-11-13)
# 原则: 可修的在 Cargo.toml 升级修复; 上游锁死/迁移成本高的显式 ignore + 理由 + followup。
# License gate 设计 (PR #301 commit d07f01b3): advisories job 非 required, cargo-deny licenses 是 required gate。

[advisories]
ignore = [
  # 1. crypto-bigint 0.5.5 (RUSTSEC-2026-0387, constant-time 时序问题)
  #    链: jsonwebtoken 11.1.0 → p256/p384 → elliptic-curve → crypto-bigint 0.5。
  #    jsonwebtoken 11.1.0 是 crates.io 最新版, 上游未升 crypto 栈 (0.5→0.7 需上游 major)。
  #    影响面: JWT 签名运算的时序侧信道 (服务端场景低危)。
  #    Followup (P1): 上游 jsonwebtoken 升级后跟进; 或替换 jwt 实现。
  "RUSTSEC-2026-0387",
  # 2. libsqlite3-sys 0.30.1 (RUSTSEC-2026-0459, vendored SQLite CVE-2026-119375, 6.8 medium)
  #    链: rusqlite 0.32 → libsqlite3-sys 0.30 (4 crate) + sqlx 0.8.0 → libsqlite3-sys =0.28。
  #    升级 rusqlite 0.42 (需 libsqlite3-sys 0.39) 与 sqlx 锁 0.28 的 links="sqlite3" 冲突,
  #    Cargo 不允许两个版本共存; sqlx 无 0.9, 0.8.x 全锁 0.28 → workspace 内无升级路径。
  #    Followup (P1): sqlx 上游放行新版 libsqlite3-sys 后, rusqlite + sqlx 同步升级。
  "RUSTSEC-2026-0459",
  # 3. rsa 0.9.10 (RUSTSEC-2023-0071, Marvin Attack 计时侧信道)
  #    star-api-rest 直接依赖 rsa 0.9 (签名) + jsonwebtoken rust_crypto 链。
  #    修复版 0.10 是大版本 API 变更; 影响面: 需本地攻击者精确计时 (服务端签名场景低危)。
  #    Followup (P1): rsa 0.10 API 迁移。
  "RUSTSEC-2023-0071",
  # 4. fxhash 0.2.1 (RUSTSEC-2025-0057, unmaintained)
  #    链: sled 0.34.7 → fxhash。sled 已停止维护, unmaintained 非漏洞。
  #    Followup (P2): arg-bridge 的 sled 存储迁移 (redb/sanakirja)。
  "RUSTSEC-2025-0057",
]
