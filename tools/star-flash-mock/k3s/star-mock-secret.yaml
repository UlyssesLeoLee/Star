# k3s/star-mock-secret.yaml — per ULYS-140 v1.2 (缺口 #5 闭合)
# 用途: star-mock service 引用 K8s Secret 的占位符定义
# 守门: #5 环境变量安全 — 本文件 0 真实 secret, 仅 secretName 引用 + base64 占位符
#       真实 secret 由 kubeseal / sealed-secrets 加密, 不进 git (per 守门 #5 + #9)
#
# 重要: data 字段值仅为占位符 (`REPLACE_WITH_KUBESEAL_*`), 实际部署必须替换为
#        `kubeseal --format yaml` 输出的 sealed secret. 本 yaml 仅作:
#        1) regression-test-system.sh §6 跨层一致性验证 (存在性 + secretName 引用)
#        2) 部署文档模板 (避免运维手抄字段名出错)

apiVersion: v1
kind: Secret
metadata:
  name: star-mock-sealed-secret-ref
  namespace: star-mock
  labels:
    app: star-mock
    component: regression-test
    managed-by: ulysses
  annotations:
    description: "Star Mock Project secret placeholder (per ULYS-140 v1.2) — real values via kubeseal, NOT committed"
    # 触发 sealed-secrets controller 解密 (per 9/1 sealed-secrets 升版)
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
data:
  # 占位符 — 真实部署走 `kubectl create secret` + `kubeseal`
  # base64 of literal placeholder strings (NOT real secrets)
  OPENAI_API_KEY: "UkVQTEFDRV9XSVRIX0tVQkVTRUFMX09QRU5BSV9BUElfS0VZ"        # REPLACE_WITH_KUBESEAL_OPENAI_API_KEY
  ANTHROPIC_API_KEY: "UkVQTEFDRV9XSVRIX0tVQkVTRUFMX0FOVFJPUFBJQ19BUElfS0VZ" # REPLACE_WITH_KUBESEAL_ANTHROPIC_API_KEY
  DATABASE_URL: "UkVQTEFDRV9XSVRIX0tVQkVTRUFMX0RBVEFCQVNFX1VSTA=="          # REPLACE_WITH_KUBESEAL_DATABASE_URL
  JWT_SIGNING_SECRET: "UkVQTEFDRV9XSVRIX0tVQkVTRUFMX0pXVF9TSUdOSU5HX1NFQ1JFVA==" # REPLACE_WITH_KUBESEAL_JWT_SIGNING_SECRET
  ENVOY_ADMIN_TOKEN: "UkVQTEFDRV9XSVRIX0tVQkVTRUFMX0VOVk9ZX0FETUlOX1RPS0VO"  # REPLACE_WITH_KUBESEAL_ENVOY_ADMIN_TOKEN

# 引用方式 (per regression-test-system.sh 验证):
#   deployment / pod env:
#     - name: OPENAI_API_KEY
#       valueFrom:
#         secretKeyRef:
#           name: star-mock-sealed-secret-ref
#           key: OPENAI_API_KEY