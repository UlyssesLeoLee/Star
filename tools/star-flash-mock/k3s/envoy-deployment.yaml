# k3s/envoy-deployment.yaml
# Envoy 独立 deployment 模式 (per 2026-09-01 13:05 JST user 拍板 envoy 部署模式偏好)
# 不选 istio sidecar, 不选 nginx (per 2026-09-01 13:03 JST 偏好所有 nginx → envoy)
# 用途: tools/star-flash-mock/ 静态资源 serving + reverse proxy + mTLS termination
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: star-mock-envoy
  namespace: star-mock
  labels:
    app: star-mock
    component: envoy
    tier: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: star-mock
      component: envoy
  template:
    metadata:
      labels:
        app: star-mock
        component: envoy
    spec:
      # v5.4 (per 2026-09-08 21:23 JST Ulysses 拍板 A "Deployment hostNetwork: true"):
      # pod 直接跟 node 网络命名空间共享, 绕开 pod network namespace 隔离.
      # 之前 v5.3 NodePort 30800 配上了但 curl fail, 根因 = klipper bind wsl VM 0.0.0.0:30800
      # 但 envoy pod 8080 在 pod 独立 namespace, wslrelay NAT 跟 klipper 30800 桥接不通.
      # 改 hostNetwork: true 后 envoy 跟 wsl VM 共享 0.0.0.0:8080, klipper 跟 wslrelay 桥接 OK.
      # 跟 v2 §9 Envoy 独立 deployment 一致.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: envoy
          image: docker.m.daocloud.io/envoyproxy/envoy:v1.32-latest  # daocloud mirror (per 2026-09-08 08:04 JST 实证 docker.io 拉超时)
          ports:
            - containerPort: 8080
              name: http
              hostPort: 8080
              protocol: TCP
            - containerPort: 8443
              name: https
              hostPort: 8443
              protocol: TCP
          env:
            - name: ENVOY_UID
              value: "0"  # 实际部署应改为非 root
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: mock-data
              mountPath: /var/lib/star-mock
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: star-mock-envoy-config
        - name: mock-data
          configMap:
            name: star-mock-mock-data
---
# P0 热修 (per 2026-09-08 07:36 JST UAT 实证): 显式声明 mock-data CM
# 原 yaml 在 volumes 引用 star-mock-mock-data, 但缺 ConfigMap 定义, pod Pending 4m 因 FailedMount
# 修法: 补一个空 ConfigMap 占位 (跟 envoy-config 同样声明在同 yaml, apply 时一次性带上)
apiVersion: v1
kind: ConfigMap
metadata:
  name: star-mock-mock-data
  namespace: star-mock
  labels:
    app: star-mock
data:
  README: |
    star-flash-mock 静态资源占位 CM
    实际数据可由 tools/star-flash-mock/mock_data/ 灌入:
      kubectl -n star-mock create cm star-mock-mock-data \
        --from-file=tools/star-flash-mock/mock_data/
  .placeholder: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: star-mock-envoy
  namespace: star-mock
  labels:
    app: star-mock
    component: envoy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
  selector:
    app: star-mock
    component: envoy
