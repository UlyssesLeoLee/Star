# k3s/star-mock-service.yaml
# star-mock ClusterIP service (k3s 内部访问)
# 业务 svc 通过 svc://star-mock-envoy.star-mock.svc.cluster.local:8080 引用
---
apiVersion: v1
kind: Service
metadata:
  name: star-mock
  namespace: star-mock
  labels:
    app: star-mock
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: star-mock
    component: envoy
---
# ConfigMap: envoy 配置 (file_system HTTP filter 托管 dist/)
# 实际部署应使用 ConfigMap + Secret + HTTPRoute (Gateway API)
apiVersion: v1
kind: ConfigMap
metadata:
  name: star-mock-envoy-config
  namespace: star-mock
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: star_mock
                    route_config:
                      virtual_hosts:
                        - name: star_mock
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/mock_data/" }
                              direct_response:
                                status: 200
                                body: { inline_string: "star-flash-mock online" }
                            - match: { prefix: "/" }
                              direct_response:
                                status: 404
                                body: { inline_string: "not found" }
