# k3s/envoy-business-config.yaml
# v0.71+v0.73 envoy 业务路由 + TLS 自动签发 + HTTP→HTTPS 强制重定向 ConfigMap
# Envoy 独立 deployment 模式 (per 2026-09-01 13:05 JST user 拍板 envoy 部署模式偏好)
# 业务路由: /mock_data/mcp/* + /mock_data/five-domain/* + /mock_data/langgraph/* + /mock_data/db-wtm/* + /api/v1/*
# TLS 终止: 8443 port (HTTPS), self-signed cert (per gen_tls_certs.sh, 90 天自动续期)
# HTTP→HTTPS 强制重定向 (per v0.73): 308 永久重定向 HTTP→HTTPS, 保留 path + query
# 不选 istio sidecar, 不选 nginx (per 2026-09-01 13:03 JST 偏好所有 nginx → envoy)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: star-mock-envoy-config
  namespace: star-mock
  labels:
    app: star-mock
    component: envoy
    version: v0.73
data:
  # Envoy bootstrap config (per envoy v1.32-latest docs)
  # 业务路由: file_system HTTP filter 托管 mock_data/ + cluster 代理 api/v1/*
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
        # HTTP listener (8080) - 业务路由 + HTTP→HTTPS 强制重定向 (per v0.73)
        - name: listener_http
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: star_mock_http
                    codec_type: AUTO
                    route_config:
                      name: star_mock_routes
                      virtual_hosts:
                        - name: star_mock_business
                          domains: ["*"]
                          # HTTP→HTTPS 强制重定向 (per v0.73): 整 virtual_host 重定向到 HTTPS
                          require_tls: ALL
                          routes:
                            - match: { prefix: "/" }
                              redirect:
                                https_redirect: true
                                # 308 永久重定向, 浏览器缓存 redirect, 后续直接走 HTTPS
                                redirect_response_code: MOVED_PERMANENTLY
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        # HTTPS listener (8443) - TLS 终止 + 业务路由 (per v0.73, 业务路由全部移到 HTTPS)
        - name: listener_https
          address:
            socket_address: { address: 0.0.0.0, port_value: 8443 }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificate_sds_secret_configs:
                      - name: star_mock_tls_cert
                        sds_config:
                          path: /etc/envoy/secrets/tls_certificate.yaml
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: star_mock_https
                    codec_type: AUTO
                    route_config:
                      name: star_mock_routes_https
                      virtual_hosts:
                        - name: star_mock_https_business
                          domains: ["*"]
                          routes:
                            # 业务路由 1: MCP mock data (16 files, per 16 MCP tools)
                            - match: { prefix: "/mock_data/mcp/" }
                              direct_response:
                                status: 200
                                body: { filename: "/var/lib/star-mock/mcp/{{ regex_replace(request.path, '^/mock_data/mcp/', '') }}" }
                            # 业务路由 2: 5-domain mock data (5 files)
                            - match: { prefix: "/mock_data/five-domain/" }
                              direct_response:
                                status: 200
                                body: { filename: "/var/lib/star-mock/five-domain/{{ regex_replace(request.path, '^/mock_data/five-domain/', '') }}" }
                            # 业务路由 3: langgraph mock data (3 files)
                            - match: { prefix: "/mock_data/langgraph/" }
                              direct_response:
                                status: 200
                                body: { filename: "/var/lib/star-mock/langgraph/{{ regex_replace(request.path, '^/mock_data/langgraph/', '') }}" }
                            # 业务路由 4: db-wtm mock data (3 files)
                            - match: { prefix: "/mock_data/db-wtm/" }
                              direct_response:
                                status: 200
                                body: { filename: "/var/lib/star-mock/db-wtm/{{ regex_replace(request.path, '^/mock_data/db-wtm/', '') }}" }
                            # 业务路由 5: agent-runtime mock data (3 files)
                            - match: { prefix: "/mock_data/agent-runtime/" }
                              direct_response:
                                status: 200
                                body: { filename: "/var/lib/star-mock/agent-runtime/{{ regex_replace(request.path, '^/mock_data/agent-runtime/', '') }}" }
                            # 业务路由 6: 根路径健康检查 (HTTPS only after v0.73 redirect)
                            - match: { prefix: "/" }
                              direct_response:
                                status: 200
                                body: { inline_string: "star-mock-envoy v0.73 online (HTTPS only)\nmock data: mcp (16) + five-domain (5) + langgraph (3) + db-wtm (3) + agent-runtime (3)\nTLS listener: 8443 (self-signed cert, per gen_tls_certs.sh)\nHTTP→HTTPS redirect: 308 (per v0.73)" }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
---
# SDS config for TLS cert hot-reload (per Envoy SDS docs)
apiVersion: v1
kind: ConfigMap
metadata:
  name: star-mock-envoy-sds
  namespace: star-mock
data:
  tls_certificate.yaml: |
    resources:
      - name: star_mock_tls_cert
        tls_certificate:
          certificate_path: /etc/envoy/certs/tls.crt
          private_key_path: /etc/envoy/certs/tls.key
---
# TLS Secret placeholder (实际 cert 由 gen_tls_certs.sh 注入)
apiVersion: v1
kind: Secret
metadata:
  name: star-mock-tls
  namespace: star-mock
type: Opaque
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    PLACEHOLDER (实际 cert 由 gen_tls_certs.sh 生成, 注入到 tls.crt 字段)
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    PLACEHOLDER (实际 key 由 gen_tls_certs.sh 生成, 注入到 tls.key 字段)
    -----END PRIVATE KEY-----
