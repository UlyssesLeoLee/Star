# k3s/star-mock-configmap.yaml — per ULYS-140 v1.2 (缺口 #5 闭合)
# 用途: star-mock service 的非敏感配置 (端口 + 路由规则 + log level)
# 守门: #5 环境变量安全 (0 secret) + #24 mock 锁 (静态 yaml, 不连真 k3s)
# 注意: 真实密钥走 K8s Secret 引用 (star-mock-secret.yaml), ConfigMap 仅放非敏感配置

apiVersion: v1
kind: ConfigMap
metadata:
  name: star-mock-config
  namespace: star-mock
  labels:
    app: star-mock
    component: regression-test
    managed-by: ulysses
  annotations:
    description: "Star Mock Project non-sensitive config (per ULYS-140 v1.2) — used by regression-test-system.sh §6 跨层一致性验证"
data:
  # 端口契约 (per 守门 #1 v29)
  STAR_MOCK_HTTP_PORT: "8080"
  STAR_MOCK_NODE_PORT: "30800"
  STAR_MOCK_HEALTH_PORT: "8081"

  # 日志级别 (非敏感)
  RUST_LOG: "info"
  RUST_BACKTRACE: "0"

  # 路由规则 (per 9/1 13:05 JST envoy 独立 deployment 偏好)
  ROUTING_MODE: "envoy-standalone"

  # Streamable HTTP 重试契约 (per ULYS-140 v1.2 缺口 #3 部分闭合)
  STREAMABLE_RETRY_MAX_ATTEMPTS: "3"
  STREAMABLE_RETRY_INITIAL_BACKOFF_MS: "100"
  STREAMABLE_RETRY_BACKOFF_MULTIPLIER: "2.0"
  STREAMABLE_RETRY_MAX_BACKOFF_MS: "2000"

  # MCP tool 16 端点契约 (per 缺口 #1 已闭合)
  MCP_TOOLS_ENABLED: "agents-list,audit-event,billing-usage,feedback,form,inbox,kms,permission,project,scm,search,sessions-create,tools-invoke,workitem-create,workitem-list,workspace"

  # DB W/T/M 强制校验 (per 守门 #13 a/b/c/d/e 派生守門 10 条)
  DB_WTM_ENFORCEMENT: "enabled"
  DB_W_WORK_RETENTION_DAYS: "7"
  DB_T_AUDIT_REQUIRED: "true"
  DB_M_RLS_REQUIRED: "true"
  DB_M_SCD_TYPE: "2"