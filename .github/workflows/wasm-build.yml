# ─────────────────────────────────────────────────────────────────────
# 已知问题 (2026-11-13 调查, 尚未修复, 本 workflow 不是必需检查):
#   自 2026-10-11 起在 "Verify Rust crates compile to wasm32" 失败, 根因在产品代码而非 CI:
#   1. graph-core 依赖 workspace 的 tokio (features=["full"]) 拖入 mio, mio 无法编译到
#      wasm32-unknown-unknown (run 42634436578: mio 48 errors)。graph-core 的 src 只用
#      tokio::sync::RwLock, 改为仅 features=["sync"] 可消除 (已本地验证 mio 错误消失)。
#   2. 之后 uuid 在 wasm32 上需要随机源 (js / rng-getrandom feature)。
#   3. relationship-engine-wasm 自己也直接依赖 tokio。
#   需由 wasm 相关负责人决定依赖策略后一并修复; 已移除原先永远不会执行的 "Commit binaries
#   to PR branch" 步骤 (条件用了不存在的 github.repository_full_name, 且默认 token 无写权限)。
# ─────────────────────────────────────────────────────────────────────
# .github/workflows/wasm-build.yml
# =====================================================================
# Auto-build Rust→WASM crates on PR push + commit binaries to frontend/public/wasm/
# Per docs/architecture/2026-09-28-upgrade/rust-to-wasm-frontend-memory-research.md §3.1 P0/P1
# + docs/architecture/2026-09-30-upgrade/rust-wasm-build-integration-guide.md
# =====================================================================
name: WASM Build

on:
  push:
    branches: [dev, main]
    paths:
      - 'crates/*-wasm/**'
      - 'scripts/build-wasm.sh'
      - '.github/workflows/wasm-build.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'crates/*-wasm/**'

permissions:
  contents: read

jobs:
  build:
    name: Build WASM + Verify
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust crates compile to wasm32
        run: |
          for crate in crates/*-wasm; do
            echo "🔍 Checking $crate..."
            cargo check --manifest-path "$crate/Cargo.toml" --target wasm32-unknown-unknown
          done

      - name: Build WASM crates (release)
        run: bash scripts/build-wasm.sh

      - name: Verify WASM binaries
        run: |
          echo "📁 Built WASM files:"
          ls -la frontend/public/wasm/
          echo ""
          echo "🔍 Verify .wasm magic bytes:"
          for f in frontend/public/wasm/*.wasm; do
            if [ -f "$f" ]; then
              magic=$(head -c 4 "$f" | xxd -p)
              if [ "$magic" = "0061736d" ]; then
                echo "  ✅ $f (size: $(stat -c %s "$f") bytes)"
              else
                echo "  ❌ $f (invalid magic: $magic)"
                exit 1
              fi
            fi
          done

      - name: Run Rust unit tests
        run: |
          for crate in crates/*-wasm; do
            echo "🧪 Testing $crate..."
            cargo test --manifest-path "$crate/Cargo.toml" --lib
          done

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-binaries
          path: frontend/public/wasm/
          retention-days: 7
