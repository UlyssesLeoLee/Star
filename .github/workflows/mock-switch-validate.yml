name: mock-switch-validate (跨项目 L1/L2/L3 cluster_switch + ACI compat 校验)

# 触发: PR 或 push 影响 tools/mock-switch-validate.py 或 mock 项目 .mock-cluster.json/.aci.json
# 目的: per ULYS-190 §4.5 — 跨项目 CI 跑 mock_switch + ACI 校验, 失败即停
# 守门: #1+#11+#12+#24 (per AGENTS.md §4)
# 实证: tools/mock-switch-validate.py v0.1 — validate-all 跨 7 项目

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "tools/mock-switch-validate.py"
      - "tools/star-flash-mock/.mock-cluster.json"
      - "tools/star-flash-mock/.aci.json"
      - ".github/workflows/mock-switch-validate.yml"
  push:
    branches: [main, dev]
    paths:
      - "tools/mock-switch-validate.py"
      - "tools/star-flash-mock/.mock-cluster.json"
      - "tools/star-flash-mock/.aci.json"
      - ".github/workflows/mock-switch-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-switch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate Star mock (per ULYS-190 §4.1 + §4.5 brief)
        working-directory: tools/star-flash-mock
        run: |
          python3 ../mock-switch-validate.py validate-one \
            --cluster-config .mock-cluster.json \
            --aci-config .aci.json
          echo "EXIT_CODE=$?"

      - name: Validate cross-project (per ULYS-190 §4.5 brief, 预期 FAIL=6 跨项目待落地)
        run: |
          python3 tools/mock-switch-validate.py validate-all | tee mock-switch-status.txt
          echo "EXIT_CODE=$?"
          # NOTE: 当前 FAIL=6 是预期 (6 跨项目待 §4.2-§4.6 brief 落地), 不 fail CI
          # 只有当 Star mock 自身 FAIL 才 fail CI
          grep "PROJECT=star-flash-mock cluster_ok=False" mock-switch-status.txt && \
            (echo "ERROR: Star mock cluster_switch 校验 fail" && exit 1) || \
            echo "OK: Star mock cluster_switch 校验通过"

      - name: Generate cross-project status report
        # report 子命令在任一项目 FAIL 时返回 1。runner 上另 6 个项目 (其他仓库在作者
        # 本机上的绝对路径) 必然 FAIL, workflow 的判定在上一步已明确为 "只有 Star mock
        # 自身 FAIL 才 fail CI", 所以这里只生成报告, 不让预期内的 FAIL 终止后续步骤。
        run: |
          python3 tools/mock-switch-validate.py report \
            --output docs/mock-switch-status.md || echo "report exit=$? (预期: 其他仓库的 mock 在 runner 上不存在)"
          cat docs/mock-switch-status.md

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mock-switch-status
          path: docs/mock-switch-status.md
          retention-days: 30
