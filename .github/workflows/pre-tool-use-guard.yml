name: pre-tool-use-guard CI

# T3.1: 跨平台 CI (Windows + Ubuntu + macOS) × Python 3.10/3.11/3.12.
# Per WBS-002 T3.1 + DD §7.3 + AC-5 (跨平台兼容 100% pass).

on:
  push:
    branches: [main]
    paths:
      - "scripts/automation/guardian/**"
      - "scripts/automation/console_server.py"
      - "scripts/automation/dispatcher.py"
      - ".github/workflows/pre-tool-use-guard.yml"
  pull_request:
    paths:
      - "scripts/automation/guardian/**"
      - "scripts/automation/console_server.py"
      - "scripts/automation/dispatcher.py"
      - ".github/workflows/pre-tool-use-guard.yml"

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # cryptography: guardian/comment_signing.py 与 tests/test_comment_signing.py 的硬依赖,
          # 缺它时 pytest 在收集阶段即 ModuleNotFoundError (PR #301 实测), 整个 job 无法运行
          pip install pytest pytest-cov cryptography
          # watchdog 可选 (graceful fallback if missing)
          pip install watchdog || echo "watchdog install failed, continuing without it"

      - name: Run unit + integration tests
        run: |
          python -m pytest scripts/automation/guardian/tests/ \
            -v \
            --tb=short \
            --cov=scripts/automation/guardian \
            --cov-report=term-missing \
            --cov-fail-under=85

      - name: Run smoke test
        run: |
          python scripts/automation/guardian/tests/test_smoke_t1.py

  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: pyflakes
        run: pip install pyflakes && python -m pyflakes scripts/automation/guardian/

  security:
    name: security check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: bandit
        run: |
          pip install bandit
          bandit -r scripts/automation/guardian/ -ll || echo "bandit warnings present (non-blocking)"
