name: pre-tool-use-guard CI

# T3.1: 跨平台 CI (Windows + Ubuntu + macOS) × Python 3.10/3.11/3.12.
# Per WBS-002 T3.1 + DD §7.3 + AC-5 (跨平台兼容 100% pass).

on:
  push:
    branches: [main]
    paths:
      - "scripts/automation/guardian/**"
      - "scripts/automation/console_server.py"
      - "scripts/automation/dispatcher.py"
      - ".github/workflows/pre-tool-use-guard.yml"
  pull_request:
    paths:
      - "scripts/automation/guardian/**"
      - "scripts/automation/console_server.py"
      - "scripts/automation/dispatcher.py"
      - ".github/workflows/pre-tool-use-guard.yml"

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # watchdog 可选 (graceful fallback if missing)
          pip install watchdog || echo "watchdog install failed, continuing without it"

      - name: Run unit + integration tests
        run: |
          python -m pytest scripts/automation/guardian/tests/ \
            -v \
            --tb=short \
            --cov=scripts/automation/guardian \
            --cov-report=term-missing \
            --cov-fail-under=85

      - name: Run smoke test
        run: |
          python scripts/automation/guardian/tests/test_smoke_t1.py

  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pyflakes
        run: pip install pyflakes && python -m pyflakes scripts/automation/guardian/

  security:
    name: security check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bandit
        run: |
          pip install bandit
          bandit -r scripts/automation/guardian/ -ll || echo "bandit warnings present (non-blocking)"
