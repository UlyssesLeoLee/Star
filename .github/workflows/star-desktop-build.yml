# .github/workflows/star-desktop-build.yml (PR-255 UPGRADED)
# =====================================================================
# Star Desktop Multi-OS Build CI (per docs §3.2 P3 + PR-253 §6)
# Multi-OS matrix: ubuntu-22.04 + windows-2022 + macos-13
# 触发: PR base=dev 或 push dev/main (per workspace lints dev-only release flow)
# =====================================================================
name: star-desktop-build

on:
  pull_request:
    branches: [dev]
    paths:
      - "crates/star-desktop/**"
      - "scripts/build-desktop.sh"
      - ".github/workflows/star-desktop-build.yml"
  push:
    branches: [dev, main]
    paths:
      - "crates/star-desktop/**"
      - "scripts/build-desktop.sh"
      - ".github/workflows/star-desktop-build.yml"

jobs:
  # =====================================================================
  # Job 1: Linux ubuntu-22.04 (cargo check + cargo test + .deb build)
  # =====================================================================
  linux-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/star-desktop/src-tauri"

      - name: Install Linux build deps (webkit2gtk, librsvg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
                                 libgtk-3-dev \
                                 libayatana-appindicator3-dev \
                                 librsvg2-dev \
                                 patchelf \
                                 build-essential \
                                 npm

      - name: cargo check -p star-desktop
        run: |
          cargo check -p star-desktop --message-format=short

      - name: cargo test -p star-desktop --lib
        run: |
          cargo test -p star-desktop --lib --message-format=short
        # 预期: 5 (P0) + 5 (P1 IPC) + 16 (P2 adapter + IPC) + 8 (P4 DB) = 34 tests pass
        # + 后续 P5 vitest 留 PR-255+ (需 frontend npm install)

      - name: Upload Linux .deb artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bash scripts/build-desktop.sh --target deb
          # Upload to GitHub Actions artifact (per docs §5)
          mkdir -p dist-artifacts
          cp -r crates/star-desktop/src-tauri/target/release/bundle/deb/*.deb dist-artifacts/ 2>/dev/null || true
          # (artifact upload 留 PR-255+)

  # =====================================================================
  # Job 2: Windows 2022 (cargo check + cargo test + .msi build)
  # =====================================================================
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/star-desktop/src-tauri"

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: cargo check -p star-desktop
        shell: bash
        run: |
          cargo check -p star-desktop --message-format=short

      - name: cargo test -p star-desktop --lib
        shell: bash
        run: |
          cargo test -p star-desktop --lib --message-format=short

      - name: Install WiX Toolset 3.x
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet tool install --global wix
          # Add WiX to PATH
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Build Windows .msi (PR-253)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          bash scripts/build-desktop.sh --target msi

      - name: Upload Windows .msi artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: star-desktop-windows-msi
          path: crates/star-desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

  # =====================================================================
  # Job 3: macOS 13 (cargo check + cargo test + .app build)
  # =====================================================================
  macos-build:
    runs-on: macos-13
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (macos universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/star-desktop/src-tauri"

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: cargo check -p star-desktop
        run: |
          cargo check -p star-desktop --message-format=short

      - name: cargo test -p star-desktop --lib
        run: |
          cargo test -p star-desktop --lib --message-format=short

      - name: Build macOS .app + .dmg (PR-253)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bash scripts/build-desktop.sh --target dmg

      - name: Upload macOS .dmg artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: star-desktop-macos-dmg
          path: crates/star-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 30

  # =====================================================================
  # Job 4: Matrix summary (验证 3 平台都 success)
  # =====================================================================
  matrix-summary:
    runs-on: ubuntu-22.04
    needs: [linux-build, windows-build, macos-build]
    if: always()
    steps:
      - name: Check all OS builds passed
        run: |
          if [[ "${{ needs.linux-build.result }}" != "success" ]]; then
            echo "❌ Linux build failed: ${{ needs.linux-build.result }}"
            exit 1
          fi
          if [[ "${{ needs.windows-build.result }}" != "success" ]]; then
            echo "❌ Windows build failed: ${{ needs.windows-build.result }}"
            exit 1
          fi
          if [[ "${{ needs.macos-build.result }}" != "success" ]]; then
            echo "❌ macOS build failed: ${{ needs.macos-build.result }}"
            exit 1
          fi
          echo "✅ All 3 OS builds passed (linux + windows + macos)"
