# Publish only the three maintained Star Canvas service images.
# Every image is built from an allowlisted, per-service Cargo context; the full
# monorepo and unrelated workspace members are never sent to BuildKit.
# GHCR_TOKEN must be configured as a repository secret with package write access.
# Never pass registry credentials as workflow dispatch inputs or print secrets.

# @cypher schema=1 source_sha256=04425d48d32a36acb8f88a485fb6f950548a76134ae7535b7cd6c24ee9f2b1d5
# MERGE (self:File {path:".github/workflows/publish-star-canvas-services.yml"})
# MERGE (consumer_verification:Config {id:"canvas.oci-consumer-attestation-verification",name:"independently verify GitHub SLSA provenance only for all three digest-pinned Canvas OCI subjects before manifest rendering; Buildx SBOM attestations are not independently verified here"})
# MERGE (consumer_permissions:Config {id:"canvas.oci-consumer-verification-permissions",name:"contents read, attestations read, packages read; no writes or id-token"})
# MERGE (release_identity:Config {id:"canvas.release-identity-artifact",name:"run-scoped canonical tag version and source SHA artifact"})
# MERGE (digest_records:Config {id:"canvas.image-digest-records",name:"run-scoped allowlisted immutable image references and sha256 digests"})
# MERGE (verify_attested_release:File {path:"scripts/release/verify_attested_release.py"})
# MERGE (render_star_canvas_manifest:File {path:"scripts/release/render_star_canvas_manifest.py"})
# MERGE (self)-[:CONFIGURES]->(consumer_verification)
# MERGE (self)-[:CONFIGURES]->(consumer_permissions)
# MERGE (self)-[:READS]->(release_identity)
# MERGE (self)-[:READS]->(digest_records)
# MERGE (self)-[:CALLS]->(verify_attested_release)
