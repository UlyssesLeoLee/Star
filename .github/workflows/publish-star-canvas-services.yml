# MERGE (self)-[:CALLS]->(render_star_canvas_manifest)
# @endcypher

name: Publish Star Canvas services

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_gate_confirmation:
        description: Confirm all stable release gates are closed before publishing
        required: true
        type: choice
        options: ["NO", "APPROVED"]
        default: "NO"

permissions:
  contents: read
  packages: none

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: UlyssesLeoLee
  IMAGE_NAMESPACE: ulyssesleolee

jobs:
  test:
    name: Check and test the three Canvas crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.99.1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - name: Check Canvas crates only
        run: cargo check -p canvas-engine -p domain-canvas -p canvas-realtime --all-targets --locked -j 4
      - name: Test Canvas crates only
        run: cargo test -p canvas-engine -p domain-canvas -p canvas-realtime --locked -j 4

  resolve_release:
    name: Resolve the exact stable tag
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_gate_confirmation == 'APPROVED' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.STAR_RELEASE_TAG }}
      version: ${{ steps.resolve.outputs.STAR_RELEASE_VERSION }}
      source_sha: ${{ steps.resolve.outputs.STAR_RELEASE_SOURCE_SHA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve exact tag, version, and source commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/resolve_star_version.py \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_WORKSPACE" \
            --output "$GITHUB_OUTPUT" \
            > "$RUNNER_TEMP/star-release.json"
      - name: Upload resolver evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: star-canvas-release-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/star-release.json
          if-no-files-found: error
          retention-days: 14

  build-and-push:
    name: Build and publish ${{ matrix.image }}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_gate_confirmation == 'APPROVED' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, resolve_release]
    runs-on: ubuntu-latest
    concurrency:
      group: star-canvas-publish-${{ github.workflow }}-${{ github.ref }}-${{ matrix.image }}
      queue: max
      cancel-in-progress: false
    environment: star-stable-release
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON('["canvas-engine","domain-canvas","canvas-realtime"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify this build checkout is the resolved release commit
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve_release.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve_release.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"

      - name: Block stable tags until package license metadata matches the selected license
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $license = python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['license'])"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo workspace license metadata.' }
          $licenseHeading = Get-Content LICENSE -TotalCount 1
          if ($license -cne 'MIT' -or $licenseHeading -cne 'MIT License') {
            throw "Stable release is blocked: Cargo workspace package license is '$license' and LICENSE heading is '$licenseHeading'; both must match the selected MIT license before publishing a version tag."
          }

      - name: Assemble and verify a minimal per-service Cargo context
        id: context
        shell: pwsh
        env:
          CANVAS_IMAGE: ${{ matrix.image }}
          STAR_RELEASE_TAG: ${{ needs.resolve_release.outputs.tag }}
          STAR_RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
          STAR_RELEASE_SOURCE_SHA: ${{ needs.resolve_release.outputs.source_sha }}
        run: |
          @'
          import json
          import os
          import re
          import shutil
          import sys
          import tomllib
          from pathlib import Path

          # Shared fail-closed game/legacy filter. The publish gate must never run
          # with a missing or unimportable policy helper, so this fails closed too.
          policy_root = Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, (policy_root / "scripts" / "release").as_posix())
          try:
              import star_canvas_context_policy as canvas_policy
          except BaseException as policy_error:
              raise SystemExit(
                  f"Star Canvas context policy helper is unavailable: {policy_error}"
              )

          def enforce(policy_check):
              """Report a policy rejection as a build failure, not a traceback."""
              try:
                  return policy_check()
              except canvas_policy.CanvasContextError as error:
                  raise SystemExit(f"Star Canvas context policy rejected this build: {error}")

          allowed = {"canvas-engine", "domain-canvas", "canvas-realtime"}
          image = os.environ["CANVAS_IMAGE"]
          if image not in allowed:
              raise SystemExit(f"Refusing unapproved Canvas image: {image}")
          enforce(lambda: canvas_policy.ensure_allowed_image(image, allowed))
          release_tag = os.environ["STAR_RELEASE_TAG"]
          release_version = os.environ["STAR_RELEASE_VERSION"]
          release_source_sha = os.environ["STAR_RELEASE_SOURCE_SHA"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", release_tag):
              raise SystemExit("Resolver output is not a canonical stable tag.")
          if release_tag[1:] != release_version:
              raise SystemExit("Resolver tag and normalized version disagree.")
          if not re.fullmatch(r"(?:[0-9a-f]{40}|[0-9a-f]{64})", release_source_sha):
              raise SystemExit("Resolver output has an invalid source commit id.")

          repo = Path(os.environ["GITHUB_WORKSPACE"])
          context = Path(os.environ["RUNNER_TEMP"]) / "star-canvas-oci" / image
          context.mkdir(parents=True, exist_ok=True)
          source_crate = repo / "crates" / image
          crate_manifest_path = source_crate / "Cargo.toml"
          root_manifest = tomllib.loads((repo / "Cargo.toml").read_text(encoding="utf-8"))
          crate_manifest = tomllib.loads(crate_manifest_path.read_text(encoding="utf-8"))
          lock_text = (repo / "Cargo.lock").read_text(encoding="utf-8")
          package = crate_manifest["package"]
          if package["name"] != image or package.get("build") or (source_crate / "build.rs").exists():
              raise SystemExit("Service manifest name/build script is outside this image allowlist.")
          if package.get("version") != {"workspace": True}:
              raise SystemExit("Canvas service version must inherit the generated tag-derived workspace version.")

          dependency_groups = ("dependencies", "dev-dependencies", "build-dependencies")
          inherited = set()
          for group in dependency_groups:
              for name, value in crate_manifest.get(group, {}).items():
                  if isinstance(value, dict) and value.get("path"):
                      raise SystemExit(f"Local path dependency is not allowed in isolated image context: {name}")
                  if isinstance(value, dict) and value.get("workspace") is True:
                      inherited.add(name)

          workspace = root_manifest["workspace"]
          workspace_dependencies = workspace["dependencies"]
          missing = inherited - workspace_dependencies.keys()
          if missing:
              raise SystemExit(f"Workspace dependencies are missing: {sorted(missing)}")
          for name in inherited:
              value = workspace_dependencies[name]
              if isinstance(value, dict) and value.get("path"):
                  raise SystemExit(f"Workspace dependency resolves to a local product crate: {name}")

          def toml_value(value):
              if isinstance(value, str):
                  return json.dumps(value, ensure_ascii=False)
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, list):
                  return "[" + ", ".join(toml_value(item) for item in value) + "]"
              if isinstance(value, dict):
                  return "{ " + ", ".join(
                      f"{key} = {toml_value(item)}" for key, item in value.items()
                  ) + " }"
              raise TypeError(f"Unsupported TOML value: {type(value).__name__}")

          def toml_table(name, values):
              return "[" + name + "]\n" + "".join(
                  f"{key} = {toml_value(value)}\n" for key, value in values.items()
              )

          generated_manifest = [
              "[workspace]",
              f"resolver = {toml_value(workspace['resolver'])}",
              f"members = {toml_value(['crates/' + image])}",
              "",
              toml_table(
                  "workspace.package",
                  {**workspace["package"], "version": release_version},
              ),
              toml_table(
                  "workspace.dependencies",
                  {name: workspace_dependencies[name] for name in sorted(inherited)},
              ),
          ]
          for table_name, values in workspace.get("lints", {}).items():
              generated_manifest.append(toml_table("workspace.lints." + table_name, values))
          generated_manifest_path = context / "Cargo.toml"
          generated_manifest_path.write_text("\n".join(generated_manifest), encoding="utf-8")
          generated_workspace = tomllib.loads(generated_manifest_path.read_text(encoding="utf-8"))
          if generated_workspace["workspace"]["package"]["version"] != release_version:
              raise SystemExit("Generated Cargo workspace version does not match the resolver output.")

          # Parse Cargo's locked package identities and dependency references.
          lock_prefix, *lock_chunks = lock_text.split("[[package]]")
          packages = []
          for chunk in lock_chunks:
              parsed = tomllib.loads("[[package]]\n" + chunk)["package"][0]
              packages.append((parsed, "[[package]]" + chunk))
          by_identity = {
              (item["name"], item["version"], item.get("source")): item
              for item, _ in packages
          }
          by_name = {}
          for identity in by_identity:
              by_name.setdefault(identity[0], []).append(identity)
          roots = [identity for identity in by_identity if identity[0] == image and identity[2] is None]
          if len(roots) != 1:
              raise SystemExit(f"Expected exactly one locked local package for {image}, found {len(roots)}")

          dependency_pattern = re.compile(r"^([^ ]+)(?: ([0-9][^ ]*))?(?: \(([^)]+)\))?$")
          edges = {}
          for identity, item in by_identity.items():
              resolved = []
              for reference in item.get("dependencies", []):
                  match = dependency_pattern.fullmatch(reference)
                  if not match:
                      raise SystemExit(f"Unrecognized Cargo.lock dependency reference: {reference}")
                  name, version, source = match.groups()
                  candidates = [
                      candidate
                      for candidate in by_name.get(name, [])
                      if (version is None or candidate[1] == version)
                      and (source is None or candidate[2] == source)
                  ]
                  if len(candidates) != 1:
                      raise SystemExit(
                          f"Cargo.lock dependency reference is not uniquely resolvable: {identity} -> {reference}"
                      )
                  resolved.append(candidates[0])
              edges[identity] = resolved

          included = set()
          pending = list(roots)
          while pending:
              identity = pending.pop()
              if identity in included:
                  continue
              included.add(identity)
              pending.extend(edges[identity])

          enforce(lambda: canvas_policy.ensure_clean_package_identities(included))

          local_dependencies = [
              identity for identity in included
              if identity[2] is None and identity[0] not in allowed
          ]
          if local_dependencies:
              raise SystemExit(f"Canvas package closure reaches non-Canvas workspace members: {local_dependencies}")
          if any(identity[0] == "star-game" for identity in included):
              raise SystemExit("Canvas package closure unexpectedly includes star-game.")

          filtered_blocks = []
          for item, block in packages:
              identity = (item["name"], item["version"], item.get("source"))
              if identity not in included:
                  continue
              if identity == roots[0]:
                  block, replacements = re.subn(
                      r'(?m)^version = "[^"]+"$',
                      f'version = "{release_version}"',
                      block,
                      count=1,
                  )
                  if replacements != 1:
                      raise SystemExit("Could not bind the filtered Canvas lock root to the resolved tag version.")
              filtered_blocks.append(block)
          filtered_lock = lock_prefix + "".join(filtered_blocks)
          parsed_filtered_lock = tomllib.loads(filtered_lock)
          filtered_names = {item["name"] for item in parsed_filtered_lock["package"]}
          if "star-game" in filtered_names or len(parsed_filtered_lock["package"]) != len(included):
              raise SystemExit("Filtered Cargo.lock failed the isolated package closure check.")
          enforce(lambda: canvas_policy.ensure_clean_package_names(filtered_names))
          release_roots = [
              item for item in parsed_filtered_lock["package"]
              if item["name"] == image and item.get("source") is None
          ]
          if len(release_roots) != 1 or release_roots[0]["version"] != release_version:
              raise SystemExit("Filtered Cargo.lock root does not match the resolved release version.")
          (context / "Cargo.lock").write_text(filtered_lock, encoding="utf-8")

          # copy2/copytree follow links, so a benign-named symlink or junction could
          # copy retired game/legacy content into the context under an accepted name.
          enforce(lambda: canvas_policy.ensure_link_free_sources(
              [
                  source_crate,
                  repo / "rust-toolchain.toml",
                  repo / "LICENSE",
                  repo / ".dockerignore",
              ],
              allowed_root=repo,
          ))

          shutil.copy2(repo / "rust-toolchain.toml", context / "rust-toolchain.toml")
          shutil.copy2(repo / "LICENSE", context / "LICENSE")
          shutil.copy2(repo / ".dockerignore", context / ".dockerignore")
          destination = context / "crates" / image
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.mkdir(parents=True, exist_ok=True)
          shutil.copy2(crate_manifest_path, destination / "Cargo.toml")
          shutil.copytree(source_crate / "src", destination / "src", dirs_exist_ok=True)
          shutil.copy2(source_crate / "Dockerfile", context / "Dockerfile")

          files = sorted(path.relative_to(context).as_posix() for path in context.rglob("*") if path.is_file())
          forbidden = [path for path in files if "game" in path.lower() or path.startswith((".git/", "target/"))]
          if forbidden:
              raise SystemExit(f"Unexpected files in image context: {forbidden}")
          enforce(lambda: canvas_policy.ensure_clean_context_paths(files))
          if any(path.startswith("crates/") and not path.startswith(f"crates/{image}/") for path in files):
              raise SystemExit("Image context contains a crate outside the allowlisted service.")
          print(f"Verified {image}: {len(included)} locked packages; {len(files)} files; no game/legacy or foreign workspace sources.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"directory={context.as_posix()}\n")
          '@ | python3 -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.38.1

      - name: Extract immutable commit tag
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/star-${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.resolve_release.outputs.version }}
            type=raw,value=${{ needs.resolve_release.outputs.source_sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ${{ steps.context.outputs.directory }}
          file: ${{ steps.context.outputs.directory }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ needs.resolve_release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.resolve_release.outputs.source_sha }}
          cache-from: type=gha,scope=star-canvas-oci-context-v1-${{ matrix.image }}
          cache-to: type=gha,scope=star-canvas-oci-context-v1-${{ matrix.image }},mode=max
          platforms: linux/amd64
          provenance: mode=max
          sbom: true

      - name: Validate immutable image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not return a valid immutable sha256 image digest." >&2
            exit 1
          fi

      - name: Create per-service resolver-bound digest record
        shell: bash
        env:
          CANVAS_IMAGE: ${{ matrix.image }}
          RELEASE_TAG: ${{ needs.resolve_release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve_release.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          DIGEST_RECORD_PATH: ${{ runner.temp }}/star-canvas-digests/${{ matrix.image }}.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          service = os.environ["CANVAS_IMAGE"]
          allowed = {"canvas-engine", "domain-canvas", "canvas-realtime"}
          if service not in allowed:
              raise SystemExit(f"Refusing unapproved Canvas digest record: {service}")
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          source_sha = os.environ["RELEASE_SOURCE_SHA"]
          digest = os.environ["IMAGE_DIGEST"]
          if tag != f"v{version}" or not re.fullmatch(r"(?:[0-9a-f]{40}|[0-9a-f]{64})", source_sha):
              raise SystemExit("Resolver tag, version, or source identity is malformed.")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Build did not return an immutable sha256 image digest.")
          repository = f"{os.environ['REGISTRY']}/{os.environ['IMAGE_NAMESPACE']}/star-{service}"
          record = {
              "service": service,
              "tag": tag,
              "version": version,
              "source_sha": source_sha,
              "version_ref": f"{repository}:{version}",
              "source_ref": f"{repository}:{source_sha}",
              "image_ref": f"{repository}@{digest}",
              "digest": digest,
          }
          path = Path(os.environ["DIGEST_RECORD_PATH"])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(record, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload per-service immutable digest record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: star-canvas-digest-${{ matrix.image }}
          path: ${{ runner.temp }}/star-canvas-digests/${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Attest the immutable Canvas image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/star-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image reference
        shell: pwsh
        env:
          CANVAS_IMAGE: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          $image = "$env:REGISTRY/$env:IMAGE_NAMESPACE/star-$env:CANVAS_IMAGE@$env:IMAGE_DIGEST"
          "Immutable image: ``$image``" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "Verify provenance: ``gh attestation verify oci://$image --repo $env:GITHUB_REPOSITORY``" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

  render-release-manifest:
    name: Render versioned digest-pinned Canvas manifest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_gate_confirmation == 'APPROVED' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, resolve_release, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify rendered template checkout is the resolved release commit
        shell: bash
        env:
          RELEASE_SOURCE_SHA: ${{ needs.resolve_release.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
      - name: Download exact resolver output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: star-canvas-release-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/star-canvas-release-identity
      - name: Download all three service digest records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: star-canvas-digest-*
          path: ${{ runner.temp }}/star-canvas-digest-records
          merge-multiple: true
      - name: Verify each immutable Canvas SLSA provenance attestation as a consumer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_TAG: ${{ needs.resolve_release.outputs.tag }}
          EXPECTED_RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
          EXPECTED_RELEASE_SOURCE_SHA: ${{ needs.resolve_release.outputs.source_sha }}
          RESOLVER_JSON: ${{ runner.temp }}/star-canvas-release-identity/star-release.json
          DIGEST_RECORD_DIR: ${{ runner.temp }}/star-canvas-digest-records
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          from scripts.release.render_star_canvas_manifest import (
              RenderError,
              validate_digest_records,
              validate_release,
          )

          release_path = Path(os.environ["RESOLVER_JSON"])
          record_dir = Path(os.environ["DIGEST_RECORD_DIR"])
          try:
              release = validate_release(json.loads(release_path.read_text(encoding="utf-8")))
              records = [
                  json.loads((record_dir / name).read_text(encoding="utf-8"))
                  for name in (
                      "canvas-engine.json",
                      "domain-canvas.json",
                      "canvas-realtime.json",
                  )
              ]
          except (OSError, json.JSONDecodeError, RenderError) as error:
              raise SystemExit(f"Release identity or Canvas digest record is invalid: {error}") from error

          expected_release = {
              "tag": os.environ["EXPECTED_RELEASE_TAG"],
              "version": os.environ["EXPECTED_RELEASE_VERSION"],
              "source_sha": os.environ["EXPECTED_RELEASE_SOURCE_SHA"],
          }
          if release != expected_release:
              raise SystemExit("Downloaded resolver identity does not match the approved release job outputs.")

          try:
              image_refs = validate_digest_records(records, release)
          except RenderError as error:
              raise SystemExit(f"Canvas digest records do not match the resolver identity: {error}") from error

          record_by_service = {record["service"]: record for record in records}
          for service in sorted(image_refs):
              record = record_by_service[service]
              command = [
                  sys.executable,
                  "scripts/release/verify_attested_release.py",
                  "--kind",
                  "canvas",
                  "--repo",
                  os.environ["GITHUB_REPOSITORY"],
                  "--tag",
                  release["tag"],
                  "--source-commit",
                  release["source_sha"],
                  "--subject",
                  f"oci://{record['image_ref']}",
                  "--expected-digest",
                  record["digest"],
              ]
              subprocess.run(command, check=True, env=os.environ.copy())
              print(f"GitHub SLSA provenance verified as a consumer: {service} {record['digest']}")

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(
                  "Independently verified GitHub SLSA provenance for all three digest-pinned Canvas image subjects. "
                  "Buildx SBOM attestations are not independently verified here. "
                  "This does not claim a Multipass/K3s deployment or rollout.\n"
              )
          PY
      - name: Render the deployable manifest
        env:
          OUTPUT_PATH: ${{ runner.temp }}/star-canvas-rendered/star-canvas-services-k3s.yaml
        run: |
          set -euo pipefail
          python3 scripts/release/render_star_canvas_manifest.py \
            --release-json "$RUNNER_TEMP/star-canvas-release-identity/star-release.json" \
            --digest-record "$RUNNER_TEMP/star-canvas-digest-records/canvas-engine.json" \
            --digest-record "$RUNNER_TEMP/star-canvas-digest-records/domain-canvas.json" \
            --digest-record "$RUNNER_TEMP/star-canvas-digest-records/canvas-realtime.json" \
            --template deploy/star-canvas-services-k3s.yaml \
            --output "$OUTPUT_PATH"
          printf 'Rendered Canvas release manifest for %s (%s, %s).\n' \
            '${{ needs.resolve_release.outputs.tag }}' \
            '${{ needs.resolve_release.outputs.version }}' \
            '${{ needs.resolve_release.outputs.source_sha }}' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload digest-pinned Canvas release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: star-canvas-k3s-manifest-${{ needs.resolve_release.outputs.tag }}-${{ needs.resolve_release.outputs.source_sha }}
          path: ${{ runner.temp }}/star-canvas-rendered/star-canvas-services-k3s.yaml
          if-no-files-found: error
          retention-days: 30
