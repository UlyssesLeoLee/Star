name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # 守门 #1 基础 (existing, per `2f6eb6b`)
  # ─────────────────────────────────────────────────────────────
  rust-ci:
    name: Rust (check / test / clippy / fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        # 守门 #1 v19: -j 4 修正 "cargo workspace 互锁" 误诊 (per AGENTS.md §4.1 v19)
        # Windows 资源耗尽 0xc0000409 + 配额不足 ERROR_NO_SYSTEM_RESOURCES 跨 17 crate 触发
        # 修法: 降并行度 -j 4, 0 err 32.27s 通过
        run: cargo check --workspace --all-targets -j 4

      - name: cargo test
        # 守门 #1 v6: release mode test 100% pass (单 crate) + v3 check + fmt + clippy 不替代 cargo test
        run: cargo test --workspace -j 4

      - name: cargo clippy (enforced)
        # 守门 #7 升级: 从 advisory 改 enforced, 0 warning 才能 merge
        # 守门 #1 v19: -j 4 修正 Windows 互锁
        run: cargo clippy --workspace --all-targets -j 4 -- -D warnings

      - name: cargo fmt --check (enforced)
        # 守门 #6 升级: 从 advisory 改 enforced, 0 diff 才能 merge
        run: cargo fmt --all -- --check

  e2e-integration:
    name: e2e Integration (P3-A.5 / wt-w32)
    runs-on: ubuntu-latest
    # 仅 main push 触发, PR 不跑(避免频繁)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo build domain-local-runtime
        run: cargo build -p domain-local-runtime --lib -j 4

      - name: cargo test e2e_integration (serial)
        # --test-threads=1 避免并发 e2e 抢端口
        run: cargo test -p domain-local-runtime --lib e2e_integration -- --test-threads=1 --nocapture

  cross-platform:
    name: Cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo build domain-local-runtime
        # 守门 #1 v19: -j 4 修正 Windows 互锁
        run: cargo build -p domain-local-runtime --lib -j 4

      - name: cargo test domain-local-runtime (skip e2e)
        # e2e 在独立 job 跑, 这里只跑单元 test
        run: cargo test -p domain-local-runtime --lib -- --skip e2e_integration -j 4

  frontend-ci:
    name: Frontend (typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx next build

  # ─────────────────────────────────────────────────────────────
  # D.6 新增 3 job (per WBS §3 D.6 + PHASE-P3-D6-IMPL-REPORT.md)
  # 触发: 2026-09-01 22:31 JST P3-D.6 真实实装触发 (per ask_user 拍板)
  # 范围: markdownlint + cargo doc + cargo bench --no-run
  # 守门 #6 实证: 真实 CI runner 需 Ulysses 拍板 (per WBS §7 阻塞项 #5)
  # ─────────────────────────────────────────────────────────────

  markdownlint:
    name: Markdown lint (markdownlint-cli2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
          ignores: |
            node_modules
            .git
            target
            frontend/node_modules
            frontend/.next
            frontend/dist
            _ARCHIVED_*.md

  cargo-doc:
    name: Rust doc (cargo doc --no-deps)
    # 守门 #1 v5: release + doc + bench --no-run 与 debug build 等价守门 (per AGENTS.md §4.1 v5)
    # 实证: per WBS §0 + A.16 commit `0e6a965` release mode cargo doc 0 warning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: RUSTDOCFLAGS deny warnings
        run: echo "RUSTDOCFLAGS=-D warnings" >> $GITHUB_ENV

      - name: cargo doc --workspace --no-deps
        # 守门 #1 v19: -j 4 修正 Windows 互锁
        run: cargo doc --workspace --no-deps --all-features -j 4

  cargo-bench-no-run:
    name: Rust bench --no-run (compile-only)
    # 守门 #1 v5: release + doc + bench --no-run 与 debug build 等价守门 (per AGENTS.md §4.1 v5)
    # 实证: per WBS §0 + A.16 commit `0e6a965` release mode cargo bench --no-run 0 err (4 crate 全 0)
    # 当前 42 crate 全 0 benches (Phase W 之前无 benchmark), 此 job 持续 0 工作
    # 但保证未来加 benches 时 CI 自动校验 (per A.16 守门承诺)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo bench --workspace --no-run
        # 守门 #1 v19: -j 4 修正 Windows 互锁
        run: cargo bench --workspace --no-run -j 4
        continue-on-error: true
        # 0 benches 时 `cargo bench --no-run` 可能因 "no targets" exit 非 0, 容忍之
        # (具体行为: cargo 对 workspace bench --no-run 0 target 会 exit 0; 显式保留 advisory)
