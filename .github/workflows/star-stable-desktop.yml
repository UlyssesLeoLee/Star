  release_metadata_gate:
    name: Verify stable release license metadata
    if: github.event_name == 'workflow_dispatch' && inputs.release_confirmation == 'APPROVED' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require MIT workspace metadata and license heading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          workspace_license = cargo.get("workspace", {}).get("package", {}).get("license")
          license_lines = Path("LICENSE").read_text(encoding="utf-8").splitlines()
          license_heading = license_lines[0].strip() if license_lines else ""
          failures = []
          if workspace_license != "MIT":
              failures.append(f"[workspace.package].license must be MIT; found {workspace_license!r}")
          if license_heading != "MIT License":
              failures.append(f"LICENSE heading must be 'MIT License'; found {license_heading!r}")
          if failures:
              print("Stable-release attestation blocked: " + "; ".join(failures), file=sys.stderr)
              raise SystemExit(1)
          print("PASS: Cargo workspace license metadata and LICENSE heading both identify MIT.")
          PY

