        shell: bash
        env:
          RELEASE_TAG: ${{ needs.linux.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.linux.outputs.release_version }}
          RELEASE_SOURCE_SHA: ${{ needs.linux.outputs.release_source_sha }}
          WINDOWS_RELEASE_TAG: ${{ needs.windows.outputs.release_tag }}
          WINDOWS_RELEASE_VERSION: ${{ needs.windows.outputs.release_version }}
          WINDOWS_RELEASE_SOURCE_SHA: ${{ needs.windows.outputs.release_source_sha }}
          MACOS_RELEASE_TAG: ${{ needs.macos.outputs.release_tag }}
          MACOS_RELEASE_VERSION: ${{ needs.macos.outputs.release_version }}
          MACOS_RELEASE_SOURCE_SHA: ${{ needs.macos.outputs.release_source_sha }}
