          startsWith(github.ref, 'refs/tags/v') &&
          needs.attest_linux.result == 'success' &&
          needs.attest_windows.result == 'success' &&
          needs.attest_macos.result == 'success' }}
    needs:
      - linux
      - windows
      - macos
      - attest_linux
      - attest_windows
      - attest_macos
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.linux.outputs.release_tag }}
          fetch-tags: true
          persist-credentials: false

