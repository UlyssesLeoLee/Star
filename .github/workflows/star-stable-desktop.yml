          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          test "$WINDOWS_RELEASE_TAG" = "$RELEASE_TAG"
          test "$MACOS_RELEASE_TAG" = "$RELEASE_TAG"
          test "$WINDOWS_RELEASE_VERSION" = "$RELEASE_VERSION"
          test "$MACOS_RELEASE_VERSION" = "$RELEASE_VERSION"
          test "$WINDOWS_RELEASE_SOURCE_SHA" = "$RELEASE_SOURCE_SHA"
          test "$MACOS_RELEASE_SOURCE_SHA" = "$RELEASE_SOURCE_SHA"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{}")" = "$RELEASE_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"

