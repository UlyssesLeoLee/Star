on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/star-stable-desktop.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/build-desktop.sh"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/star-stable-desktop.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/build-desktop.sh"
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Select APPROVED only when authorizing stable release attestations; keep NO for routine checks."
        required: true
        type: choice
        default: NO
        options:
          - NO
          - APPROVED

permissions:
  contents: read

concurrency:
  group: star-stable-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.99.0"
  CARGO_BUILD_JOBS: "2"

jobs:
  linux:
    name: Linux .deb and AppImage
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.resolve_release.outputs.STAR_RELEASE_TAG }}
      release_version: ${{ steps.resolve_release.outputs.STAR_RELEASE_VERSION }}
      release_source_sha: ${{ steps.resolve_release.outputs.STAR_RELEASE_SOURCE_SHA }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/crates/star-desktop/src-tauri/target
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve exact stable tag before build mutations
        id: resolve_release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python scripts/release/resolve_star_version.py --tag "$GITHUB_REF_NAME" --output "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: crates/star-desktop/frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Install pinned Rust SBOM generator
        run: cargo install cargo-sbom --version 0.10.0 --locked

      - name: Install locked frontend dependencies
        working-directory: crates/star-desktop/frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend unit tests
        working-directory: crates/star-desktop/frontend
        run: npm test -- --reporter=dot

      - name: Build frontend
        working-directory: crates/star-desktop/frontend
        run: npm run build

      - name: Build desktop bundles with canonical release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: crates/star-desktop
        env:
          STAR_RELEASE_TAG: ${{ steps.resolve_release.outputs.STAR_RELEASE_TAG }}
          STAR_RELEASE_VERSION: ${{ steps.resolve_release.outputs.STAR_RELEASE_VERSION }}
          STAR_RELEASE_SOURCE_SHA: ${{ steps.resolve_release.outputs.STAR_RELEASE_SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          : "${STAR_RELEASE_TAG:?missing resolver tag}"
          : "${STAR_RELEASE_VERSION:?missing resolver version}"
          : "${STAR_RELEASE_SOURCE_SHA:?missing resolver source SHA}"
          frontend/node_modules/.bin/tauri build --config "{\"version\":\"${STAR_RELEASE_VERSION}\"}" --bundles deb,appimage -- --locked

      - name: Build desktop bundles with the development crate version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: crates/star-desktop
        run: frontend/node_modules/.bin/tauri build --bundles deb,appimage -- --locked

      - name: Write Linux build identity
        shell: bash
        env:
          STAR_RELEASE_TAG: ${{ steps.resolve_release.outputs.STAR_RELEASE_TAG }}
          STAR_RELEASE_VERSION: ${{ steps.resolve_release.outputs.STAR_RELEASE_VERSION }}
          STAR_RELEASE_SOURCE_SHA: ${{ steps.resolve_release.outputs.STAR_RELEASE_SOURCE_SHA }}
        run: |
          set -euo pipefail
          if [[ -n "$STAR_RELEASE_TAG" ]]; then
            python -c 'import json,os,pathlib; pathlib.Path("crates/star-desktop/star-desktop-release-identity.json").write_text(json.dumps({"channel":"stable","tag":os.environ["STAR_RELEASE_TAG"],"version":os.environ["STAR_RELEASE_VERSION"],"source_sha":os.environ["STAR_RELEASE_SOURCE_SHA"]},sort_keys=True)+chr(10),encoding="utf-8")'
          else
            python -c 'import json,os,pathlib; pathlib.Path("crates/star-desktop/star-desktop-release-identity.json").write_text(json.dumps({"channel":"development","source_sha":os.environ["GITHUB_SHA"]},sort_keys=True)+chr(10),encoding="utf-8")'
          fi

      - name: Require non-empty Linux bundles
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find "$CARGO_TARGET_DIR/release/bundle/deb" -maxdepth 1 -type f -name '*.deb' -size +0c -print -quit)"
          appimage="$(find "$CARGO_TARGET_DIR/release/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -size +0c -print -quit)"
          test -n "$deb" || { echo "Missing non-empty .deb artifact" >&2; exit 1; }
          test -n "$appimage" || { echo "Missing non-empty AppImage artifact" >&2; exit 1; }
          printf '%s\n%s\n' "$deb" "$appimage"

      - name: Generate Rust dependency SBOM
        shell: bash
        run: cargo sbom --project-directory . --cargo-package star-desktop --output-format spdx_json_2_3 > crates/star-desktop/src-tauri/star-desktop-rust.spdx.json

      - name: Generate frontend dependency SBOM
        working-directory: crates/star-desktop/frontend
        shell: bash
        run: npm sbom --package-lock-only --sbom-format=spdx > star-desktop-frontend.spdx.json

      - name: Validate Linux SBOMs
        shell: bash
        run: |
          set -euo pipefail
          rust_sbom="crates/star-desktop/src-tauri/star-desktop-rust.spdx.json"
          frontend_sbom="crates/star-desktop/frontend/star-desktop-frontend.spdx.json"
          test -s "$rust_sbom"
          test -s "$frontend_sbom"
          node -e 'const fs=require("node:fs"),check=(s,n,m)=>{if(!s||s.spdxVersion!=="SPDX-2.3")throw Error("SPDX-2.3");if(!Array.isArray(s.packages)||!s.packages.length)throw Error("packages");if(!Array.isArray(s.relationships)||!s.relationships.length)throw Error("relationships");if(s.packages.length<m)throw Error("minimum");const r=s.packages.find(p=>p&&p.name===n&&p.SPDXID);if(!r)throw Error("root");if(!s.relationships.some(x=>x&&x.spdxElementId==="SPDXRef-DOCUMENT"&&x.relationshipType==="DESCRIBES"&&x.relatedSpdxElement===r.SPDXID))throw Error("DESCRIBES")},reject=(s,n,m,k)=>{try{check(s,n,m)}catch(e){if(e.message===k)return;throw e}throw Error("self-test "+k)},r={spdxVersion:"SPDX-2.3",packages:[{name:"star-desktop",SPDXID:"SPDXRef-Package-star-desktop"}],relationships:[{spdxElementId:"SPDXRef-DOCUMENT",relationshipType:"DESCRIBES",relatedSpdxElement:"SPDXRef-Package-star-desktop"}]};reject({...r,packages:[]},"star-desktop",1,"packages");reject({...r,relationships:[]},"star-desktop",1,"relationships");check(r,"star-desktop",1);const ps=Array.from({length:225},(_,i)=>({name:i===0?"star-desktop-frontend":"p"+i,SPDXID:"SPDXRef-Package-"+i})),f={spdxVersion:"SPDX-2.3",packages:ps,relationships:[{spdxElementId:"SPDXRef-DOCUMENT",relationshipType:"DESCRIBES",relatedSpdxElement:ps[0].SPDXID}]};check(f,"star-desktop-frontend",225);reject({...f,packages:ps.slice(0,224)},"star-desktop-frontend",225,"minimum");const a=process.argv.slice(1);if(a.length!==2)throw Error("expected Rust and frontend SBOM paths");check(JSON.parse(fs.readFileSync(a[0],"utf8")),"star-desktop",1);check(JSON.parse(fs.readFileSync(a[1],"utf8")),"star-desktop-frontend",225);console.log("PASS: empty-array mutations rejected; valid SPDX 2.3 controls passed; 224 npm packages rejected; 225-package control and actual SBOMs passed.")' "$rust_sbom" "$frontend_sbom"
          if grep -Eiq 'star[-_]game' "$rust_sbom" "$frontend_sbom"; then echo "Unexpected retired game package in Desktop SBOM" >&2; exit 1; fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: star-desktop-linux-${{ steps.resolve_release.outputs.STAR_RELEASE_TAG || 'development' }}-${{ steps.resolve_release.outputs.STAR_RELEASE_VERSION || 'development' }}-${{ steps.resolve_release.outputs.STAR_RELEASE_SOURCE_SHA || github.sha }}-unsigned
          path: |
            crates/star-desktop/star-desktop-release-identity.json
            crates/star-desktop/src-tauri/target/release/bundle/deb/*.deb
            crates/star-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            crates/star-desktop/src-tauri/star-desktop-rust.spdx.json
            crates/star-desktop/frontend/star-desktop-frontend.spdx.json
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows MSI
    runs-on: windows-2025
    outputs:
      release_tag: ${{ steps.resolve_release.outputs.STAR_RELEASE_TAG }}
      release_version: ${{ steps.resolve_release.outputs.STAR_RELEASE_VERSION }}
      release_source_sha: ${{ steps.resolve_release.outputs.STAR_RELEASE_SOURCE_SHA }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\crates\star-desktop\src-tauri\target
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve exact stable tag before build mutations
        id: resolve_release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: py -3 scripts/release/resolve_star_version.py --tag "$env:GITHUB_REF_NAME" --output "$env:GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: crates/star-desktop/frontend/package-lock.json

      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Install pinned Rust SBOM generator
        run: cargo install cargo-sbom --version 0.10.0 --locked

      - name: Install locked frontend dependencies
        working-directory: crates/star-desktop/frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend unit tests
        working-directory: crates/star-desktop/frontend
        run: npm test -- --reporter=dot

      - name: Build frontend
        working-directory: crates/star-desktop/frontend
        run: npm run build

      - name: Build Windows MSI with canonical release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: crates/star-desktop
        env:
          STAR_RELEASE_TAG: ${{ steps.resolve_release.outputs.STAR_RELEASE_TAG }}
          STAR_RELEASE_VERSION: ${{ steps.resolve_release.outputs.STAR_RELEASE_VERSION }}
          STAR_RELEASE_SOURCE_SHA: ${{ steps.resolve_release.outputs.STAR_RELEASE_SOURCE_SHA }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STAR_RELEASE_TAG)) { throw "Missing resolver tag" }
          if ([string]::IsNullOrWhiteSpace($env:STAR_RELEASE_VERSION)) { throw "Missing resolver version" }
          if ([string]::IsNullOrWhiteSpace($env:STAR_RELEASE_SOURCE_SHA)) { throw "Missing resolver source SHA" }
          frontend/node_modules/.bin/tauri.cmd build --config ('{"version":"' + $env:STAR_RELEASE_VERSION + '"}') --bundles msi -- --locked

      - name: Build Windows MSI with the development crate version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: crates/star-desktop
        run: frontend/node_modules/.bin/tauri.cmd build --bundles msi -- --locked

      - name: Write Windows build identity
        shell: pwsh
        env:
          STAR_RELEASE_TAG: ${{ steps.resolve_release.outputs.STAR_RELEASE_TAG }}
          STAR_RELEASE_VERSION: ${{ steps.resolve_release.outputs.STAR_RELEASE_VERSION }}
          STAR_RELEASE_SOURCE_SHA: ${{ steps.resolve_release.outputs.STAR_RELEASE_SOURCE_SHA }}
        run: |
          if ($env:STAR_RELEASE_TAG) {
            $identity = [ordered]@{
              channel = 'stable'
              tag = $env:STAR_RELEASE_TAG
              version = $env:STAR_RELEASE_VERSION
              source_sha = $env:STAR_RELEASE_SOURCE_SHA
            }
          } else {
            $identity = [ordered]@{
              channel = 'development'
              source_sha = $env:GITHUB_SHA
            }
          }
          $identity | ConvertTo-Json -Compress | Set-Content -LiteralPath 'crates/star-desktop/star-desktop-release-identity.json' -Encoding utf8NoBOM

      - name: Require non-empty MSI
        shell: pwsh
        run: |
          $bundleDirectory = Join-Path $env:CARGO_TARGET_DIR 'release\bundle\msi'
          $installers = @(Get-ChildItem -LiteralPath $bundleDirectory -Filter '*.msi' -File -ErrorAction Stop | Where-Object { $_.Length -gt 0 })
          if ($installers.Count -eq 0) { throw "Missing non-empty MSI under $bundleDirectory" }
          $installers | ForEach-Object { $_.FullName }

      - name: Generate Rust dependency SBOM
        shell: bash
        run: cargo sbom --project-directory . --cargo-package star-desktop --output-format spdx_json_2_3 > crates/star-desktop/src-tauri/star-desktop-rust.spdx.json

      - name: Generate frontend dependency SBOM
        working-directory: crates/star-desktop/frontend
        shell: bash
        run: npm sbom --package-lock-only --sbom-format=spdx > star-desktop-frontend.spdx.json

      - name: Validate Windows SBOMs
        shell: bash
        run: |
          set -euo pipefail
          rust_sbom="crates/star-desktop/src-tauri/star-desktop-rust.spdx.json"
          frontend_sbom="crates/star-desktop/frontend/star-desktop-frontend.spdx.json"
          test -s "$rust_sbom"
          test -s "$frontend_sbom"
          node -e 'const fs=require("node:fs"),check=(s,n,m)=>{if(!s||s.spdxVersion!=="SPDX-2.3")throw Error("SPDX-2.3");if(!Array.isArray(s.packages)||!s.packages.length)throw Error("packages");if(!Array.isArray(s.relationships)||!s.relationships.length)throw Error("relationships");if(s.packages.length<m)throw Error("minimum");const r=s.packages.find(p=>p&&p.name===n&&p.SPDXID);if(!r)throw Error("root");if(!s.relationships.some(x=>x&&x.spdxElementId==="SPDXRef-DOCUMENT"&&x.relationshipType==="DESCRIBES"&&x.relatedSpdxElement===r.SPDXID))throw Error("DESCRIBES")},reject=(s,n,m,k)=>{try{check(s,n,m)}catch(e){if(e.message===k)return;throw e}throw Error("self-test "+k)},r={spdxVersion:"SPDX-2.3",packages:[{name:"star-desktop",SPDXID:"SPDXRef-Package-star-desktop"}],relationships:[{spdxElementId:"SPDXRef-DOCUMENT",relationshipType:"DESCRIBES",relatedSpdxElement:"SPDXRef-Package-star-desktop"}]};reject({...r,packages:[]},"star-desktop",1,"packages");reject({...r,relationships:[]},"star-desktop",1,"relationships");check(r,"star-desktop",1);const ps=Array.from({length:225},(_,i)=>({name:i===0?"star-desktop-frontend":"p"+i,SPDXID:"SPDXRef-Package-"+i})),f={spdxVersion:"SPDX-2.3",packages:ps,relationships:[{spdxElementId:"SPDXRef-DOCUMENT",relationshipType:"DESCRIBES",relatedSpdxElement:ps[0].SPDXID}]};check(f,"star-desktop-frontend",225);reject({...f,packages:ps.slice(0,224)},"star-desktop-frontend",225,"minimum");const a=process.argv.slice(1);if(a.length!==2)throw Error("expected Rust and frontend SBOM paths");check(JSON.parse(fs.readFileSync(a[0],"utf8")),"star-desktop",1);check(JSON.parse(fs.readFileSync(a[1],"utf8")),"star-desktop-frontend",225);console.log("PASS: empty-array mutations rejected; valid SPDX 2.3 controls passed; 224 npm packages rejected; 225-package control and actual SBOMs passed.")' "$rust_sbom" "$frontend_sbom"
          if grep -Eiq 'star[-_]game' "$rust_sbom" "$frontend_sbom"; then echo "Unexpected retired game package in Desktop SBOM" >&2; exit 1; fi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: star-desktop-windows-${{ steps.resolve_release.outputs.STAR_RELEASE_TAG || 'development' }}-${{ steps.resolve_release.outputs.STAR_RELEASE_VERSION || 'development' }}-${{ steps.resolve_release.outputs.STAR_RELEASE_SOURCE_SHA || github.sha }}-unsigned
          path: |
            crates/star-desktop/star-desktop-release-identity.json
            crates/star-desktop/src-tauri/target/release/bundle/msi/*.msi
            crates/star-desktop/src-tauri/star-desktop-rust.spdx.json
            crates/star-desktop/frontend/star-desktop-frontend.spdx.json
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS universal DMG
    runs-on: macos-15
    outputs:
      release_tag: ${{ steps.resolve_release.outputs.STAR_RELEASE_TAG }}
      release_version: ${{ steps.resolve_release.outputs.STAR_RELEASE_VERSION }}
      release_source_sha: ${{ steps.resolve_release.outputs.STAR_RELEASE_SOURCE_SHA }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/crates/star-desktop/src-tauri/target
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve exact stable tag before build mutations
        id: resolve_release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python scripts/release/resolve_star_version.py --tag "$GITHUB_REF_NAME" --output "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: crates/star-desktop/frontend/package-lock.json

      - name: Install Rust 1.99.0 and universal targets
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 aarch64-apple-darwin x86_64-apple-darwin

      - name: Install pinned Rust SBOM generator
        run: cargo install cargo-sbom --version 0.10.0 --locked

      - name: Install locked frontend dependencies
        working-directory: crates/star-desktop/frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend unit tests
        working-directory: crates/star-desktop/frontend
        run: npm test -- --reporter=dot

      - name: Build frontend
        working-directory: crates/star-desktop/frontend
        run: npm run build

      - name: Build universal macOS DMG with canonical release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: crates/star-desktop
        env:
          STAR_RELEASE_TAG: ${{ steps.resolve_release.outputs.STAR_RELEASE_TAG }}
          STAR_RELEASE_VERSION: ${{ steps.resolve_release.outputs.STAR_RELEASE_VERSION }}
          STAR_RELEASE_SOURCE_SHA: ${{ steps.resolve_release.outputs.STAR_RELEASE_SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          : "${STAR_RELEASE_TAG:?missing resolver tag}"
          : "${STAR_RELEASE_VERSION:?missing resolver version}"
          : "${STAR_RELEASE_SOURCE_SHA:?missing resolver source SHA}"
          frontend/node_modules/.bin/tauri build --config "{\"version\":\"${STAR_RELEASE_VERSION}\"}" --target universal-apple-darwin --bundles dmg -- --locked

      - name: Build universal macOS DMG with the development crate version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: crates/star-desktop
        run: frontend/node_modules/.bin/tauri build --target universal-apple-darwin --bundles dmg -- --locked

      - name: Write macOS build identity
        shell: bash
        env:
          STAR_RELEASE_TAG: ${{ steps.resolve_release.outputs.STAR_RELEASE_TAG }}
          STAR_RELEASE_VERSION: ${{ steps.resolve_release.outputs.STAR_RELEASE_VERSION }}
          STAR_RELEASE_SOURCE_SHA: ${{ steps.resolve_release.outputs.STAR_RELEASE_SOURCE_SHA }}
        run: |
          set -euo pipefail
          if [[ -n "$STAR_RELEASE_TAG" ]]; then
