# This workflow creates a lockfile-driven Next.js build evidence bundle. It does
# not deploy to Vercel or claim that the bundle is a Vercel deployment.
on:
  workflow_dispatch:
    inputs:
      release_gate_confirmation:
        description: Confirm the stable release gates are closed before generating evidence
        required: true
        type: choice
        options: [NO, APPROVED]
        default: NO

permissions:
  contents: read

concurrency:
  group: star-stable-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-attest:
    name: Build and attest the Star Web evidence bundle
    runs-on: ubuntu-24.04
    environment: star-stable-release
    permissions:
      contents: read
      attestations: write
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true

      - name: Require approved version tag
        shell: bash
        env:
          RELEASE_GATE_CONFIRMATION: ${{ inputs.release_gate_confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Stable Web evidence can only be generated from a version tag." >&2
            exit 1
          fi
          if [[ "$RELEASE_GATE_CONFIRMATION" != APPROVED ]]; then
            echo "Stable Web evidence requires explicit APPROVED confirmation." >&2
            exit 1
          fi

      - name: Resolve canonical release tag, version, and source SHA
        id: resolve-release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 ../scripts/release/resolve_star_version.py \
            --tag "$RELEASE_TAG" \
            --repo .. \
            --output "$GITHUB_OUTPUT"
          resolved_source_sha="$(git -C .. rev-parse --verify "refs/tags/$RELEASE_TAG^{}")"
          if [[ "$resolved_source_sha" != "$GITHUB_SHA" ]]; then
            echo "Stable Web evidence is blocked: the exact tag target does not match the workflow source SHA." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend unit tests
        run: npm test -- --reporter=dot

      - name: Build Next.js output
        run: npm run build

      - name: Generate and validate SPDX SBOM
        shell: bash
        env:
          STAR_RELEASE_TAG: ${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}
          STAR_RELEASE_VERSION: ${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}
          STAR_RELEASE_SOURCE_SHA: ${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}
        run: |
          set -euo pipefail
          bundle_name="star-web-build-evidence-$STAR_RELEASE_TAG-$STAR_RELEASE_VERSION-$STAR_RELEASE_SOURCE_SHA"
          mkdir -p "dist/$bundle_name"
          npm sbom --sbom-format=spdx > "dist/$bundle_name/sbom.spdx.json"
          node - "dist/$bundle_name/sbom.spdx.json" <<'NODE'
          const fs = require("node:fs");
          const sbomPath = process.argv[2];
          const sbom = JSON.parse(fs.readFileSync(sbomPath, "utf8"));
          if (sbom.spdxVersion !== "SPDX-2.3") {
            throw new Error("Expected SPDX-2.3, got " + (sbom.spdxVersion ?? "missing version"));
          }
          if (!Array.isArray(sbom.packages) || sbom.packages.length === 0) {
            throw new Error("The npm SBOM has no package records.");
          }
          NODE

      - name: Pack Web build evidence with normalized archive metadata
        id: pack-evidence
        shell: bash
        env:
          STAR_RELEASE_TAG: ${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}
          STAR_RELEASE_VERSION: ${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}
          SOURCE_COMMIT: ${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}
        run: |
          set -euo pipefail
          bundle_name="star-web-build-evidence-$STAR_RELEASE_TAG-$STAR_RELEASE_VERSION-$SOURCE_COMMIT"
          bundle="dist/$bundle_name"
          test -s .next/BUILD_ID
          test -d public
          cp -a .next "$bundle/.next"
          cp -a public "$bundle/public"
          cp package.json package-lock.json next.config.js vercel.json "$bundle/"
          {
            printf 'release_tag=%s\n' "$STAR_RELEASE_TAG"
            printf 'release_version=%s\n' "$STAR_RELEASE_VERSION"
            printf 'source_commit=%s\n' "$SOURCE_COMMIT"
            printf 'node=%s\n' "$(node --version)"
            printf 'npm=%s\n' "$(npm --version)"
            printf 'package_lock_sha256=%s\n' "$(sha256sum package-lock.json | cut -d ' ' -f 1)"
          } > "$bundle/build-info.txt"
          source_date_epoch="$(git -C .. show -s --format=%ct "$SOURCE_COMMIT")"
          test -n "$source_date_epoch"
          archive="$bundle.tar.gz"
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner \
            -cf - -C dist "$bundle_name" | gzip -n > "$archive"
          test -s "$archive"
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

      - name: Upload stable Web evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: star-web-build-evidence-${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}-${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}-${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}
          path: |
            frontend/dist/star-web-build-evidence-${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}-${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}-${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}.tar.gz
            frontend/dist/star-web-build-evidence-${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}-${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}-${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}.tar.gz.sha256
            frontend/dist/star-web-build-evidence-${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}-${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}-${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}/sbom.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Attest Web build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: frontend/dist/star-web-build-evidence-${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}-${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}-${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}.tar.gz

      - name: Attest Web SBOM for the build archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: frontend/dist/star-web-build-evidence-${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}-${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}-${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}.tar.gz
          sbom-path: frontend/dist/star-web-build-evidence-${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}-${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}-${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}/sbom.spdx.json

      - name: Record consumer verification guidance
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          STAR_RELEASE_TAG: ${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}
          STAR_RELEASE_VERSION: ${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}
          STAR_RELEASE_SOURCE_SHA: ${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}
        run: |
          bundle_name="star-web-build-evidence-$STAR_RELEASE_TAG-$STAR_RELEASE_VERSION-$STAR_RELEASE_SOURCE_SHA"
          archive="$bundle_name.tar.gz"
          {
            echo "Release tag: $STAR_RELEASE_TAG"
            echo "Release version: $STAR_RELEASE_VERSION"
            echo "Source commit: $STAR_RELEASE_SOURCE_SHA"
            echo "The uploaded archive is a build evidence bundle, not a Vercel deployment."
            echo "Verify the downloaded archive with: gh attestation verify $archive --repo $SOURCE_REPOSITORY"
            echo "Verify its SHA-256 using $archive.sha256."
          } >> "$GITHUB_STEP_SUMMARY"

  verify-consumer:
    name: Independently verify the Web evidence attestation
    if: ${{ inputs.release_gate_confirmation == 'APPROVED' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-and-attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true

      - name: Re-resolve exact release identity
        id: resolve-release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release/resolve_star_version.py \
            --tag "$RELEASE_TAG" \
            --repo . \
            --output "$GITHUB_OUTPUT"
          resolved_source_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{}")"
          if [[ "$resolved_source_sha" != "$GITHUB_SHA" ]]; then
            echo "Consumer verification is blocked: tag target does not match this workflow source SHA." >&2
            exit 1
          fi

      - name: Download exact Web evidence artifact from the producer job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: star-web-build-evidence-${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}-${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}-${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}
          path: artifacts/web

      - name: Verify downloaded archive, checksum, and attestation
        shell: bash
        env:
          STAR_RELEASE_TAG: ${{ steps.resolve-release.outputs.STAR_RELEASE_TAG }}
          STAR_RELEASE_VERSION: ${{ steps.resolve-release.outputs.STAR_RELEASE_VERSION }}
          STAR_RELEASE_SOURCE_SHA: ${{ steps.resolve-release.outputs.STAR_RELEASE_SOURCE_SHA }}
        run: |
          set -euo pipefail
          bundle_name="star-web-build-evidence-$STAR_RELEASE_TAG-$STAR_RELEASE_VERSION-$STAR_RELEASE_SOURCE_SHA"
          archive="artifacts/web/$bundle_name.tar.gz"
          checksum_file="$archive.sha256"
          sbom="artifacts/web/$bundle_name/sbom.spdx.json"
          test -s "$archive"
          test -s "$checksum_file"
          test -s "$sbom"
          (cd artifacts/web && sha256sum --check "$(basename "$checksum_file")")
          expected_digest="sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)"
          python3 scripts/release/verify_attested_release.py \
            --kind web \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$STAR_RELEASE_TAG" \
            --source-commit "$STAR_RELEASE_SOURCE_SHA" \
            --subject "$archive" \
            --expected-digest "$expected_digest" \
            --timeout 240
          sbom_attestation_json="$RUNNER_TEMP/star-web-spdx-attestation.json"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$STAR_RELEASE_SOURCE_SHA" \
            --source-ref "refs/tags/$STAR_RELEASE_TAG" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/star-stable-web.yml" \
            --predicate-type "https://spdx.dev/Document/v2.3" \
            --format json > "$sbom_attestation_json"
          python3 - "$sbom_attestation_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          predicate_type = "https://spdx.dev/Document/v2.3"
          with Path(sys.argv[1]).open(encoding="utf-8") as stream:
              results = json.load(stream)
          if not isinstance(results, list) or not results:
              raise SystemExit("gh attestation verify returned no verified SPDX attestations.")
          verified_spdx = [
              entry
              for entry in results
              if isinstance(entry, dict)
              and isinstance(entry.get("attestation"), dict)
              and isinstance(entry.get("verificationResult"), dict)
              and isinstance(entry["verificationResult"].get("statement"), dict)
              and entry["verificationResult"]["statement"].get("predicateType") == predicate_type
          ]
          if not verified_spdx:
              raise SystemExit("No successfully verified SPDX 2.3 attestation was present in gh JSON output.")
          print(f"Verified {len(verified_spdx)} SPDX 2.3 attestation(s) for the Web evidence archive.")
          PY
          {
            echo "Consumer provenance and SPDX attestation verification passed for $bundle_name."
            echo "Verified archive digest: $expected_digest"
            echo "Verified source: $STAR_RELEASE_SOURCE_SHA ($STAR_RELEASE_TAG)."
            echo "This validates the build-evidence archive attestation; it does not deploy to Vercel or prove a production deployment."
          } >> "$GITHUB_STEP_SUMMARY"
