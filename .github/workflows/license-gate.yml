name: License & Advisory Gate

# ─────────────────────────────────────────────────────────────────────
# 门禁: 商业开源依赖硬约束 (AGENTS.md §0) 首次自动化
#
# 2026-10-04 落地。此前 11 个 workflow 中零个包含 license/advisory/SBOM 检查,
# 即 AGENTS.md §0 "逐版本审查完整构建/分发闭包" 完全依赖人工。
# 落地依据: ADR-0054 §5.2 + PHASE-CD-SELECTION-REPORT.md
#
# 设计约束 (per 本次实跑经验):
#   1. 许可门禁与 advisory 门禁拆为**独立 job**。若合并在一个 job, 前序 step 失败会
#      跳过后续所有 step, 导致"某门禁其实从未真正跑过"却显示 job 失败 (假红) 或
#      (若 continue-on-error) 假绿。独立 job 保证两者都真实执行。
#   2. 直接调 CLI 而非用第三方 action 转发, 让退出码由 shell 原生传播; 并 echo
#      工具自己的结论行 (如 "error: ...") 便于从日志核对"门禁真的跑了"。
#   3. 二进制版本钉死 + SHA256 校验: 门禁判据不应随第三方发版漂移。
#      (cargo-deny 0.20 移除了 licenses.deny / unlicensed 键, 即版本漂移会静默改语义)
#   4. 不用 pip install: ubuntu-24.04 runner 的 PEP 668 会拒系统 pip 安装。
#      此处不涉及 Python 工具, 一并记此以免后续误加。
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 门禁失败不阻塞其他 workflow (advisory 类问题可先记录后修),
# 但本 workflow 内两个 job 互不依赖, 都会真实执行。
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: 许可门禁 (cargo-deny) — AGENTS.md §0 商业开源依赖硬约束
  # ─────────────────────────────────────────────────────────────
  license-gate:
    name: License (cargo-deny)
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        # 必须与 rust-toolchain.toml (channel = 1.98.1) 一致, 否则 cargo metadata 解析失败
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Fetch cargo-deny (pinned + checksum-verified)
        # 预编译二进制而非 `cargo install`: cargo install cargo-deny 需完整编译依赖树,
        # 在 runner 上约 5-10 分钟, 远超本门禁应有时长
        run: |
          set -euo pipefail
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" -o /tmp/cargo-deny.tar.gz
          echo "${CARGO_DENY_SHA256}  /tmp/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tar.gz -C /usr/local/bin
          chmod +x /usr/local/bin/cargo-deny
          cargo-deny --version

      - name: cargo-deny check (licenses / bans / sources)
        # 全 feature 图: 覆盖构建/分发闭包全集 (per deny.toml [graph] all-features = true)
        # --hide-inclusion-graph 控制日志体积; 诊断文本本身不打码
        run: |
          set -euo pipefail
          cargo-deny --all-features check

      - name: Export license inventory (SPDX evidence)
        # 产出可审计的许可清单证据, 供人工逐项复核 (per AGENTS.md §0 "逐版本审查")
        # 失败不阻塞主门禁: 导出是辅助产物, 门禁判定以上一步为准
        continue-on-error: true
        run: |
          mkdir -p target/license-gate
          cargo-deny --all-features list --format json > target/license-gate/licenses.json 2>/dev/null || \
            echo "warn: license list export unavailable in this cargo-deny version"
          cargo-deny --all-features list --format human > target/license-gate/licenses.txt 2>/dev/null || true

      - name: Upload license inventory
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: license-inventory
          path: target/license-gate/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Job 2: 漏洞门禁 (cargo-audit / RustSec) — 供应链根信任
  # ─────────────────────────────────────────────────────────────
  advisory-gate:
    name: Advisories (cargo-audit)
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
      CARGO_AUDIT_SHA256: "REPLACE_WITH_UPSTREAM_SHA256_FOR_0.22.2"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Fetch cargo-audit (pinned)
        # 同样的预编译 + 校验策略。SHA256 需从上游 release .sha256 文件取:
        #   curl -fsSL https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/cargo-audit-v${CARGO_AUDIT_VERSION}-x86_64-unknown-linux-musl.tar.gz.sha256
        # 占位未填是**有意为之**: 未经本机实跑校验的校验和不得写入门禁 (per 缺标比错标安全)
        run: |
          set -euo pipefail
          if [ "${CARGO_AUDIT_SHA256}" = "REPLACE_WITH_UPSTREAM_SHA256_FOR_0.22.2" ]; then
            echo "::error::CARGO_AUDIT_SHA256 未填。填入上游 .sha256 实测值后本门禁才生效。"
            echo "::error::在填入前, 本 job 恒定失败 (fail-closed), 不会假装通过。"
            exit 2
          fi
          url="https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/cargo-audit-v${CARGO_AUDIT_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" -o /tmp/cargo-audit.tar.gz
          echo "${CARGO_AUDIT_SHA256}  /tmp/cargo-audit.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cargo-audit.tar.gz -C /usr/local/bin
          chmod +x /usr/local/bin/cargo-audit
          cargo-audit --version

      - name: cargo audit
        run: |
          set -euo pipefail
          cargo-audit audit

  # ─────────────────────────────────────────────────────────────
  # Job 3: 未使用依赖 (cargo-machete) — 收敛闭包, 减少审查面
  # ─────────────────────────────────────────────────────────────
  unused-dep-gate:
    name: Unused deps (cargo-machete)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.98.1

      - name: cargo machete
        # advisory 模式: 本仓 workspace.dependencies 采用集中声明 + crate 级引用,
        # 静态分析对未直接引用但经 feature 间接使用的依赖会误报。
        # 实测本机 cargo-machete 0.9.2 结果须人工复核后再收紧为 enforced。
        run: cargo install cargo-machete --version 0.9.2 --locked && cargo machete
