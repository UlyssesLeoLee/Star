      .layout-a .index-link, .layout-b .index-link { width: auto; min-width: max-content; margin: 0; }
      .layout-c .project-rail { display: none; }
      .mobile-project { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 9px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 11px; background: #171d26; }
      .layout-c .app-workspace { grid-template-columns: 1fr; }
      .layout-c .focus-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
      .layout-c .focus-panel .section-label { grid-column: 1 / -1; margin: 0; }
      .layout-c .focus-panel .tree-node { margin: 0; }
      .layout-c .focus-panel .branch-leaf { grid-column: 1 / -1; margin: 0; }
      .main-panel { padding: 14px; }
      .page-heading { flex-direction: column; }
      .run-summary { grid-template-columns: 1fr; gap: 6px; margin: 13px 0; }
      .summary-cell { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; }
      .summary-label { margin: 0; }
      .tabs { margin-right: -3px; }
      .task-card { grid-template-columns: auto 1fr; }
      .task-state { grid-column: 2; justify-self: start; }
      .index-panel, .run-panel, .focus-panel { padding: 13px; }

      .chat-dock { padding: 8px 9px 10px; }
      .chat-shell { grid-template-columns: 1fr auto; gap: 7px; padding: 8px; }
      .scope-switch { grid-column: 1 / -1; justify-content: flex-start; }
      .scope-button { padding: 6px 8px; }

      .chat-send { grid-column: 2; }
      .variant-switcher { bottom: 130px; }
      .variant-readout { min-width: 155px; }
      .step { font-size: 8px; }
      .step-line { margin: 0 4px; }
      .step-number { width: 17px; height: 17px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }

</head>
<body>
  <div class="prototype-banner" role="note">
    <span><strong>UI-1 本地交互原型</strong> · 仅演示导航与状态；目录为样例数据，不连接服务或执行命令。</span>
    <div class="prototype-actions">
      <button class="quiet-button" type="button" data-action="simulate-deep-link">模拟深链授权</button>
      <button class="quiet-button" type="button" data-action="revoke-access">模拟撤销 Worktree 焦点权限</button>
      <button class="quiet-button" type="button" data-action="revoke-index-access">模拟撤销 Project Index 列表权限</button>
    </div>
  </div>
  <div class="app-frame">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">W</div>
        <div><div class="brand-name">渡口</div><div class="brand-subtitle">Project workspace</div></div>
      </div>
      <nav class="breadcrumbs" aria-label="当前层级">
        <span>Project</span><span class="crumb-separator">›</span><span>Engineering Run</span><span class="crumb-separator">›</span><span>Worktree</span><span class="crumb-separator">›</span><span>Branch</span>
      </nav>
      <div class="user-chip"><span class="avatar" aria-hidden="true">U</span><span class="user-name">本地原型会话</span><span aria-hidden="true">⌄</span></div>
    </header>
    <div id="prototype" aria-live="polite"></div>
  </div>
  <div class="chat-dock" id="chatDock"></div>
  <nav class="variant-switcher" aria-label="切换原型布局">
    <button class="switch-button" type="button" data-action="variant-prev" aria-label="上一种布局">‹</button>
    <div class="variant-readout"><div class="variant-name" id="variantName"></div><div class="variant-hint">布局方案 · 可分享 ?variant= 参数</div></div>
    <button class="switch-button" type="button" data-action="variant-next" aria-label="下一种布局">›</button>
  </nav>
  <script>
    const variantNames = { A: "项目树 · 工作台", B: "Project Worktree Index", C: "聚焦式控制台" };
    const variantOrder = ["A", "B", "C"];
    const initialVariant = new URLSearchParams(window.location.search).get("variant");
    const state = {
      variant: variantNames[initialVariant] ? initialVariant : "A",
      worktreeId: null,
      focus: false,
      authorization: "idle",
      authorizationGeneration: 0,
      authorizedGeneration: null,
      indexAuthorization: "idle",
      indexGeneration: 0,
      indexAuthorizedGeneration: null,
      indexReturnView: "workspace",
      view: "workspace",
      app: "tasks",
      taskOpen: false,
      chatScope: "GLOBAL",
      pendingWorktreeId: null,
      drafts: { WORKTREE: { "wt-navigation": "", "wt-validation": "" }, GLOBAL: "" }
    };
    const root = document.getElementById("prototype");

    function clearWorktreeFocus(nextAuthorization = "idle") {
      state.authorizationGeneration += 1;
      state.authorizedGeneration = null;
      state.worktreeId = null;
      state.pendingWorktreeId = null;
      state.focus = false;
      state.authorization = nextAuthorization;
      state.taskOpen = false;
      state.chatScope = "GLOBAL";
      state.indexReturnView = "workspace";
    }

    function worktreeFocusReady() {
      return state.focus && state.authorization === "ready" && state.authorizedGeneration === state.authorizationGeneration && !!state.worktreeId;
    }

    function restoreIndexReturnView() {
      state.view = worktreeFocusReady() && state.indexReturnView === "apps" ? "apps" : "workspace";
      state.indexReturnView = "workspace";
    }

    function beginWorktreeAuthorization(worktreeId) {
      clearWorktreeFocus("checking");
      state.pendingWorktreeId = worktreeId;
      state.view = "workspace";
    }

    function beginProjectIndexAuthorization() {
      if (worktreeFocusReady()) state.indexReturnView = "apps";
      else if (state.view !== "index") state.indexReturnView = "workspace";
      state.indexGeneration += 1;
      state.indexAuthorizedGeneration = null;
      state.indexAuthorization = "checking";
      state.view = "index";
    }

    function indexAuthorizationReady() {
      return state.indexAuthorization === "ready" && state.indexAuthorizedGeneration === state.indexGeneration;
    }

    function render() {
      const variant = state.variant;
      const focusReady = worktreeFocusReady();
      const showIndexRows = indexAuthorizationReady();
      const showApps = focusReady && state.view === "apps";
      const worktreeTree = showIndexRows ? `
        <div class="tree-indent">
          <button class="tree-node ${focusReady && state.worktreeId === "wt-navigation" ? "selected" : ""}" type="button" data-action="select-navigation">
            <span class="node-icon" aria-hidden="true">W</span><span class="node-copy"><span class="node-title">导航流程</span><span class="node-meta">Worktree · Project 列表样例</span></span>
          </button>
          ${focusReady && state.worktreeId === "wt-navigation" ? `<div class="branch-leaf">Branch · local/ui/navigation</div>` : ""}
          <button class="tree-node ${focusReady && state.worktreeId === "wt-validation" ? "selected" : ""}" type="button" data-action="select-validation">
            <span class="node-icon" aria-hidden="true">W</span><span class="node-copy"><span class="node-title">授权验证</span><span class="node-meta">Worktree · Project 列表样例</span></span>
          </button>
          ${focusReady && state.worktreeId === "wt-validation" ? `<div class="branch-leaf">Branch · local/ui/validation</div>` : ""}
        </div>` : `
        <div class="tree-access-state">${state.indexAuthorization === "checking" ? "Project Index 列表权限正在验证；受保护的 Worktree 与 Branch 行已收起。" : state.indexAuthorization === "denied" || state.indexAuthorization === "revoked" ? "Project Index 列表未授权；受保护的 Worktree 与 Branch 行已隐藏。" : "先验证 Project Index 列表权限；对象名称与 Branch 值已隐藏。"}</div>`;
      const projectTree = `
        <div class="section-label">Project</div>
        <button class="project-option" type="button" aria-current="page">
          <span class="project-icon" aria-hidden="true">P</span>
          <span class="project-copy"><span class="project-title">Project 导航容器</span><span class="project-meta">身份与资源按授权加载</span></span>
          <span aria-hidden="true">⌄</span>
        </button>
        <div class="tree-block">
          <div class="section-label">Engineering Runs</div>
          <div class="tree-indent">
            <div class="tree-node" aria-current="true"><span class="node-caret" aria-hidden="true">⌄</span><span class="node-icon" aria-hidden="true">R</span><span class="node-copy"><span class="node-title">Engineering Run</span><span class="node-meta">Run 导航容器</span></span></div>
            ${worktreeTree}
          </div>
        </div>
        <button class="index-link" type="button" data-action="show-index"><span aria-hidden="true">▦</span> Project Worktree Index <span aria-hidden="true">↗</span></button>
        <div class="side-footer">Project 是第一层。Run、Worktree 与本地 Branch 按层展开。</div>`;
      const summary = focusReady ? `
        <div class="run-summary" aria-label="当前资源路径">
          <div class="summary-cell"><span class="summary-label">Project</span><span class="summary-value">示例项目</span></div>
          <div class="summary-cell"><span class="summary-label">Engineering Run</span><span class="summary-value">工作区导航</span></div>
          <div class="summary-cell"><span class="summary-label">Worktree / Branch</span><span class="summary-value mono">${state.worktreeId === "wt-navigation" ? "导航流程 · local/ui/navigation" : "授权验证 · local/ui/validation"}</span></div>
        </div>` : `
        <div class="run-summary" aria-label="当前资源路径">
          <div class="summary-cell"><span class="summary-label">Project</span><span class="summary-value">Project</span></div>
          <div class="summary-cell"><span class="summary-label">Engineering Run</span><span class="summary-value">Engineering Run</span></div>
          <div class="summary-cell"><span class="summary-label">Worktree</span><span class="summary-value">未验证</span></div>
          <div class="summary-cell"><span class="summary-label">Branch</span><span class="summary-value">未加载</span></div>
        </div>`;
      const appTabs = showApps ? `
        <nav class="tabs" aria-label="Run 应用">
          <button class="tab ${state.app === "inbox" ? "active" : ""}" type="button" data-action="tab-inbox" aria-pressed="${state.app === "inbox"}">收件箱</button>
          <button class="tab ${state.app === "tasks" ? "active" : ""}" type="button" data-action="tab-tasks" aria-pressed="${state.app === "tasks"}">Task Cards</button>
          <button class="tab ${state.app === "canvas" ? "active" : ""}" type="button" data-action="tab-canvas" aria-pressed="${state.app === "canvas"}">Canvas</button>
          <button class="tab ${state.app === "workflow" ? "active" : ""}" type="button" data-action="tab-workflow" aria-pressed="${state.app === "workflow"}">Workflow</button>
          <button class="tab ${state.app === "bi" ? "active" : ""}" type="button" data-action="tab-bi" aria-pressed="${state.app === "bi"}">Run BI / Benchmark</button>
          <button class="tab ${state.app === "plugins" ? "active" : ""}" type="button" data-action="tab-plugins" aria-pressed="${state.app === "plugins"}">Plugin Apps</button>
        </nav>` : "";
      const indexRows = `
        <div style="overflow-x:auto">
          <table class="index-table"><thead><tr><th>Engineering Run</th><th>Worktree</th><th>Branch（本地）</th><th>状态</th><th></th></tr></thead><tbody>
            <tr><td>工作区导航</td><td>导航流程 · 样例</td><td class="mono-text">local/ui/navigation · 样例</td><td><span class="row-status">演示项</span></td><td><button class="worktree-row-button" type="button" data-action="open-navigation">验证并打开</button></td></tr>
            <tr><td>工作区导航</td><td>授权验证 · 样例</td><td class="mono-text">local/ui/validation · 样例</td><td><span class="row-status">演示项</span></td><td><button class="worktree-row-button" type="button" data-action="open-validation">验证并打开</button></td></tr>
          </tbody></table>
        </div>`;
      const indexStatus = state.indexAuthorization === "checking" ? `
        <div class="empty-state"><div><div class="empty-icon" aria-hidden="true">…</div><h3>正在验证 Project Index 列表权限</h3><p>列表授权与 Worktree 焦点授权相互独立。验证期间不显示 Worktree 名称、计数或 Branch 值。</p><div class="empty-actions"><button class="primary-button" type="button" data-action="authorize-index">模拟列表验证通过</button><button class="secondary-button" type="button" data-action="deny-index">模拟无权查看列表</button><button class="quiet-button" type="button" data-action="cancel-index">取消</button></div></div></div>` : state.indexAuthorization === "denied" || state.indexAuthorization === "revoked" ? `
        <div class="empty-state"><div><div class="empty-icon" aria-hidden="true">⌁</div><h3>Project Index 列表未授权</h3><p>受保护的 Worktree 行和 Branch 值已隐藏。重新验证仅检查列表权限，不会授权打开具体 Worktree。</p><button class="primary-button" type="button" data-action="retry-index">重新验证 Project Index</button></div></div>` : !indexAuthorizationReady() ? `
        <div class="empty-state"><div><div class="empty-icon" aria-hidden="true">⌁</div><h3>先验证 Project Index 列表权限</h3><p>列表权限只允许查看 Project 范围的样例；打开每个 Worktree 时还会单独验证 Worktree 焦点。</p><button class="primary-button" type="button" data-action="retry-index">验证 Project Index 列表权限</button></div></div>` : indexRows;
      const indexMarkup = `
        <section class="index-panel" aria-labelledby="indexTitle">
          <div class="content-heading"><div><div class="eyebrow">Project view</div><h2 id="indexTitle">Project Worktree Index</h2></div>${showIndexRows ? `<span class="count-pill">2 个样例 Worktrees</span>` : ""}</div>
          ${state.view === "index" && focusReady ? `<button class="secondary-button" type="button" data-action="return-focus">返回当前 Worktree（取消列表验证）</button>` : ""}
          <p class="subtle">Project 列表权限与单个 Worktree 焦点权限分别验证；列表行只代表独立列表授权，不代表当前 Worktree 焦点已授权。打开每个 Worktree 都会重新检查焦点。行内对象仅为原型样例。</p>
          ${indexStatus}
        </section>`;
      let appMarkup = "";
      if (state.view === "index" && variant === "B") {
        appMarkup = `<section class="empty-state"><div><div class="empty-icon" aria-hidden="true">⌁</div><h2>${indexAuthorizationReady() ? "从左侧 Project Index 选择 Worktree" : "Project 列表尚未授权"}</h2><p>Index 只提供 Project 范围的列表视图。打开一项后还会单独验证 Worktree 焦点；两个权限没有相互继承关系。</p></div></section>`;
      } else if (state.view === "index") {
        appMarkup = indexMarkup;
      } else if (state.authorization === "checking") {
        appMarkup = `<section class="empty-state"><div><div class="empty-icon" aria-hidden="true">…</div><h2>正在验证 Worktree scope</h2><p>验证期间隐藏 Run Apps、Branch 和旧焦点内容。按钮只切换本地原型状态。</p><div class="empty-actions"><button class="primary-button" type="button" data-action="authorize-link">模拟验证通过</button><button class="secondary-button" type="button" data-action="deny-link">模拟无权访问</button><button class="quiet-button" type="button" data-action="cancel-auth">取消并返回 Project</button></div></div></section>`;
      } else if (!focusReady) {
        appMarkup = `<section class="empty-state"><div><div class="empty-icon" aria-hidden="true">⌁</div><h2>${state.authorization === "denied" ? "当前身份无权访问此 Worktree" : state.authorization === "revoked" ? "Worktree 授权已撤销" : "先选择并验证一个 Worktree"}</h2><p>${state.authorization === "revoked" ? "Worktree 焦点、Run Apps、Branch 值和 WORKTREE 聊天范围已清除。" : state.authorization === "denied" ? "当前没有 Worktree 焦点；Run Apps、Branch 值和 WORKTREE 聊天范围均已清除。" : "Project 与 Run 导航保留；先验证 Project Index 列表，或显式模拟深链，再单独验证 Worktree 焦点。"}</p><div class="empty-actions"><button class="primary-button" type="button" data-action="show-index">验证 Project Index</button><button class="secondary-button" type="button" data-action="simulate-deep-link">显式模拟深链</button>${state.pendingWorktreeId ? `<button class="quiet-button" type="button" data-action="retry-auth">重新验证当前 Worktree</button>` : ""}</div></div></section>`;
      } else if (state.taskOpen && state.app === "tasks") {
        appMarkup = `
          <section class="content-area" aria-labelledby="taskDetailTitle">
            <div class="content-heading"><div><div class="eyebrow">Run 级 Task Card</div><h2 id="taskDetailTitle">整理 Project → Run 导航状态</h2></div><button class="small-button" type="button" data-action="close-task">返回任务列表</button></div>
            <div class="detail-grid"><div class="detail-block"><h3>任务归属与执行上下文</h3><p>Task Card 归属当前 Engineering Run。Worktree 与本地 Branch 只是 CLI 的执行上下文，不改变任务归属；启用 CLI 时必须使用当前重新授权的 Worktree。</p><ul><li>任务归属：工作区导航 Run</li><li>CLI Worktree：${state.worktreeId === "wt-navigation" ? "导航流程" : "授权验证"}（当前授权焦点）</li><li>本地 Branch：${state.worktreeId === "wt-navigation" ? "local/ui/navigation" : "local/ui/validation"}</li><li>完成后需要独立验证并记录证据。</li></ul><div class="cli-locked"><strong>受控 CLI 尚未接入</strong><p>必须先具备真实 Agent Runtime、隔离 sandbox、原生 Hook、资源预算、当前授权复验、取消/恢复、独立验证和结果回写。</p><button class="disabled-button" type="button" disabled aria-disabled="true">打开受控 CLI · 当前不可用</button></div></div><div class="detail-block"><h3>任务状态</h3><p><span class="task-state review">待验证</span></p><p>任务可见不代表 Agent 执行 provider 已连接。此原型不会启动终端或写入任务数据。</p><button class="secondary-button" type="button" data-action="tab-canvas">在 Canvas 中查看关联</button></div></div>
          </section>`;
      } else if (state.app === "tasks") {
        appMarkup = `
          <section class="content-area" aria-labelledby="taskListTitle">
            <div class="content-heading"><div><div class="eyebrow">Run App · Run 级任务</div><h2 id="taskListTitle">Task Cards</h2></div><span class="count-pill">2 个原型场景</span></div>
            <div class="task-list">
              <button class="task-card" type="button" data-action="open-task"><span class="task-mark" aria-hidden="true">T1</span><span style="text-align:left"><span class="task-title">整理 Project → Run 导航状态</span><span class="task-meta">负责人：本地场景 · 关联 Canvas 节点 1</span></span><span class="task-state review">待验证</span></button>
              <button class="task-card" type="button" data-action="open-task"><span class="task-mark" aria-hidden="true">T2</span><span style="text-align:left"><span class="task-title">补齐 Worktree 焦点撤权流程</span><span class="task-meta">负责人：本地场景 · 关联 Canvas 节点 2</span></span><span class="task-state">待处理</span></button>
            </div>
            <div class="auth-warning">任务标题与状态只是原型演示数据。没有连接真实 Task owner 或 Agent provider。</div>
          </section>`;
      } else if (state.app === "canvas") {
        appMarkup = `
          <section class="content-area" aria-labelledby="canvasTitle">
            <div class="content-heading"><div><div class="eyebrow">Run App · 同级应用</div><h2 id="canvasTitle">Canvas</h2></div><span class="subtle">画布节点只引用 Task Card，不复制任务事实</span></div>
            <div class="canvas-board" aria-label="原型 Canvas 区域"><span class="connector" aria-hidden="true"></span><button class="canvas-card one" type="button" data-action="open-task"><span class="task-title">Task Card · 导航状态</span><span class="task-meta">打开 canonical Task Card</span></button><div class="canvas-card two"><span class="task-title">工作流注释</span><span class="task-meta">与任务建立引用关系；不产生第二份 Task 事实</span></div></div>
          </section>`;
      } else {
        const appNames = { inbox: "收件箱", workflow: "Workflow", bi: "Run BI / Benchmark", plugins: "Plugin Apps" };
        appMarkup = `<section class="not-connected"><div><div class="empty-icon" aria-hidden="true">↗</div><h2>${appNames[state.app] || "Run App"} 尚未连接</h2><p>原型只展示同级位置，不代表对应 owner API、授权、事件投递或生产数据已接入。</p><button class="secondary-button" type="button" data-action="tab-tasks">返回 Task Cards</button></div></section>`;
      }
      const statusPill = focusReady ? `<span class="focus-pill"><span class="status-dot" aria-hidden="true"></span>Worktree scope 已验证</span>` : `<span class="focus-pill" style="border-color:#624b30;background:#30271b;color:#f0d59b">${state.authorization === "checking" ? "正在验证 scope" : state.authorization === "revoked" ? "授权已撤销" : state.authorization === "denied" ? "无权访问" : "未建立 Worktree 焦点"}</span>`;
      const bodyContent = variant === "B" ? `
        <div class="workspace-grid">
          ${indexMarkup}
          <section class="focus-panel"><div class="page-heading"><div><div class="eyebrow">Current Worktree</div><h1>Run 工作区</h1><p class="heading-subtitle">从 Project Index 打开后，进入对应 Run 与 Worktree。</p></div>${statusPill}</div>${summary}${appTabs}${appMarkup}</section>
        </div>` : `
        <main class="main-panel">
          <div class="page-heading"><div><div class="eyebrow">Engineering Run · 工作区</div><h1>${state.view === "index" ? "Project Worktree Index" : "Run 工作区"}</h1><p class="heading-subtitle">${state.view === "index" ? "跨 Worktree 汇总；选择一项后返回对应 Worktree。" : "先确定有效 Worktree 焦点，再浏览该 Run 的应用。"}</p></div>${statusPill}</div>
          ${variant === "C" ? `<div class="stepper" aria-label="导航层级"><span class="step active"><span class="step-number">1</span>Project</span><span class="step-line"></span><span class="step active"><span class="step-number">2</span>Run</span><span class="step-line"></span><span class="step ${focusReady ? "active" : ""}"><span class="step-number">3</span>Worktree</span><span class="step-line"></span><span class="step ${focusReady ? "active" : ""}"><span class="step-number">4</span>Branch</span></div>` : ""}
          ${summary}${appTabs}<div class="content-area">${appMarkup}</div>
        </main>`;
      if (variant === "A") {
        root.innerHTML = `<div class="layout layout-a"><aside class="sidebar" aria-label="Project 导航">${projectTree}</aside>${bodyContent}</div>`;
      } else if (variant === "B") {
        root.innerHTML = `<div class="layout layout-b"><aside class="project-rail" aria-label="Project 与 Run 导航">${projectTree}</aside>${bodyContent}</div>`;
      } else {
        root.innerHTML = `<div class="layout layout-c"><aside class="project-rail" aria-label="Project 导航">${projectTree}</aside><div><div class="mobile-project"><strong>Project 导航</strong><button class="small-button" type="button" data-action="show-index">Worktree Index</button></div>${bodyContent}</div></div>`;
      }
      document.getElementById("chatDock").innerHTML = `
        <div class="chat-shell" aria-label="底部聊天栏">
          <div class="scope-switch" role="group" aria-label="聊天范围">
            <button class="scope-button ${state.chatScope === "GLOBAL" ? "active" : ""}" type="button" data-action="scope-global" aria-pressed="${state.chatScope === "GLOBAL"}">GLOBAL</button>
            <button class="scope-button ${state.chatScope === "WORKTREE" ? "active" : ""}" type="button" data-action="scope-worktree" aria-pressed="${state.chatScope === "WORKTREE"}" ${focusReady ? "" : "disabled"}>WORKTREE</button>
          </div>
          <div class="chat-input-wrap"><div class="chat-context"><strong>${state.chatScope}</strong><span>${state.chatScope === "WORKTREE" && focusReady ? `· 示例项目 / 工作区导航 / ${state.worktreeId === "wt-navigation" ? "导航流程" : "授权验证"}` : "· 不含隐式 Worktree 写入范围"}</span></div><textarea id="chatDraft" class="chat-draft" aria-label="本地草稿" placeholder="输入仅保存在当前原型内存中的草稿…"></textarea></div>
          <button class="chat-send" type="button" disabled aria-disabled="true">发送未接入</button>
        </div>`;
      const draftEditor = document.getElementById("chatDraft");
      draftEditor.value = state.chatScope === "WORKTREE" ? (state.drafts.WORKTREE[state.worktreeId] || "") : state.drafts.GLOBAL;
      document.getElementById("variantName").textContent = `${variant} · ${variantNames[variant]}`;
      document.querySelector(".variant-switcher").hidden = false;
    }

    function handleClick(event) {
      const button = event.target.closest("[data-action]");
      if (!button || button.disabled) return;
      const action = button.dataset.action;
      const focusReady = worktreeFocusReady();
      const showIndexRows = indexAuthorizationReady();
      const actionToApp = { "tab-inbox": "inbox", "tab-tasks": "tasks", "tab-canvas": "canvas", "tab-workflow": "workflow", "tab-bi": "bi", "tab-plugins": "plugins" };
      if (action === "variant-prev" || action === "variant-next") {
        const currentIndex = variantOrder.indexOf(state.variant);
        const direction = action === "variant-next" ? 1 : -1;
        state.variant = variantOrder[(currentIndex + direction + variantOrder.length) % variantOrder.length];
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set("variant", state.variant);
        window.history.replaceState(null, "", nextUrl);
      } else if ((action === "select-navigation" || action === "open-navigation") && showIndexRows) {
        beginWorktreeAuthorization("wt-navigation");
      } else if ((action === "select-validation" || action === "open-validation") && showIndexRows) {
        beginWorktreeAuthorization("wt-validation");
      } else if (action === "authorize-link") {
        if (state.authorization === "checking" && state.pendingWorktreeId) {
          state.worktreeId = state.pendingWorktreeId;
          state.pendingWorktreeId = null;
          state.focus = true;
          state.authorization = "ready";
          state.authorizedGeneration = state.authorizationGeneration;
          state.view = "apps";
          state.indexReturnView = "apps";
        }
      } else if (action === "cancel-auth") {
        clearWorktreeFocus("idle");
        state.view = indexAuthorizationReady() ? "index" : "workspace";
      } else if (action === "deny-link") {
        if (state.authorization === "checking" && state.pendingWorktreeId) {
          state.authorizationGeneration += 1;
          state.authorizedGeneration = null;
          state.worktreeId = null;
          state.focus = false;
          state.authorization = "denied";
          state.view = "workspace";
          state.taskOpen = false;
          state.chatScope = "GLOBAL";
          state.indexReturnView = "workspace";
        }
      } else if (action === "retry-auth" || action === "restore-focus") {
        const targetWorktreeId = state.pendingWorktreeId || state.worktreeId || "wt-navigation";
        beginWorktreeAuthorization(targetWorktreeId);
      } else if (action === "authorize-index") {
        if (state.indexAuthorization === "checking") {
          state.indexAuthorization = "ready";
          state.indexAuthorizedGeneration = state.indexGeneration;
          state.view = "index";
        }
      } else if (action === "deny-index") {
        if (state.indexAuthorization === "checking") {
          state.indexAuthorization = "denied";
          state.indexAuthorizedGeneration = null;
          restoreIndexReturnView();
        }
      } else if (action === "retry-index" || action === "show-index") {
        beginProjectIndexAuthorization();
      } else if (action === "cancel-index") {
        state.indexGeneration += 1;
        state.indexAuthorizedGeneration = null;
        state.indexAuthorization = "idle";
        restoreIndexReturnView();
      } else if (action === "return-focus" && focusReady) {
        if (state.indexAuthorization === "checking") {
          state.indexGeneration += 1;
          state.indexAuthorizedGeneration = null;
          state.indexAuthorization = "idle";
        }
        state.view = "apps";
        state.indexReturnView = "workspace";
      } else if (action === "simulate-deep-link") {
        beginWorktreeAuthorization(state.pendingWorktreeId || state.worktreeId || "wt-navigation");
      } else if (action === "revoke-access") {
        clearWorktreeFocus("revoked");
        state.view = "workspace";
      } else if (action === "revoke-index-access") {
        if (state.view !== "index") state.indexReturnView = worktreeFocusReady() && state.view === "apps" ? "apps" : "workspace";
        state.indexGeneration += 1;
        state.indexAuthorizedGeneration = null;
        state.indexAuthorization = "revoked";
        restoreIndexReturnView();
      } else if (action === "scope-global") {
        state.chatScope = "GLOBAL";
      } else if (action === "scope-worktree" && focusReady) {
        state.chatScope = "WORKTREE";
      } else if (action === "open-task" && focusReady) {
        state.app = "tasks";
        state.view = "apps";
        state.taskOpen = true;
      } else if (action === "close-task") {
        state.taskOpen = false;
      } else if (actionToApp[action] && focusReady) {
        state.app = actionToApp[action];
        state.view = "apps";
        state.taskOpen = false;
      }
      render();
    }

    function handleInput(event) {
      if (event.target.matches("#chatDraft")) {
        if (state.chatScope === "WORKTREE") state.drafts.WORKTREE[state.worktreeId] = event.target.value;
        else state.drafts.GLOBAL = event.target.value;
      }
    }

    document.addEventListener("click", handleClick);
    document.addEventListener("input", handleInput);
    render();
  </script>
</body>
</html>
