<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>收件箱</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="font-family: Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; color: #111827; background: #F7F7F5; min-height: 900px; display: flex; flex-direction: column; font-size: 13px">
<header style="height: 52px; background: #FFFFFF; border-bottom: 1px solid #E2E1DC; display: flex; align-items: center; gap: 16px; padding: 0 16px; flex-wrap: wrap">
  <div style="display: flex; align-items: center; gap: 8px; width: 208px">
    <div style="width: 26px; height: 26px; border-radius: 6px; background: #1F2937; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600">S</div>
    <span style="font-weight: 600; font-size: 15px">Star</span>
  </div>
  <span style="color: #6B7280">全局</span><span style="color: #9CA3AF">/</span><span style="font-weight: 600">收件箱</span>
  <span style="flex: 1 1 auto"></span>
  <label style="display: flex; align-items: center"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜索</span>
    <input type="search" placeholder="搜索 ⌘K" style="width: 220px; height: 32px; border-radius: 6px; border: 1px solid #E5E7EB; background: #F3F4F6; padding: 0 10px; font: inherit"></label>
  <button type="button" aria-label="用户资料：Ulysses" style="height: 36px; padding: 0 10px 0 4px; border-radius: 999px; border: 1px solid #E5E7EB; background: #FFFFFF; display: flex; align-items: center; gap: 8px">
    <span style="width: 28px; height: 28px; border-radius: 50%; background: #DBEAFE; color: #1E3A8A; font-weight: 600; display: flex; align-items: center; justify-content: center">U</span>Ulysses</button>
</header>
<div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; min-height: 848px">
<aside style="flex: 0 0 240px; background: #FFFFFF; border-right: 1px solid #E2E1DC; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #374151">
  <span>▸ Physis / GVPE</span><span>▸ StarGate Dashboard</span><span>▸ Mobile Companion</span>
  <div style="margin-top: auto; border-top: 1px solid #E5E7EB; padding-top: 10px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 11px; color: #6B7280; margin-bottom: 2px">全局</div>
    <a href="#" aria-current="page" style="padding: 6px 8px; border-radius: 5px; background: #EEF2FF; color: #3730A3; font-weight: 600; text-decoration: none">收件箱 · 5</a>
    <a href="Agents.dc.html" style="padding: 6px 8px; color: #374151; text-decoration: none">Agent 中心</a>
    <a href="Analytics.dc.html" style="padding: 6px 8px; color: #374151; text-decoration: none">分析</a>
  </div>
</aside>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-wrap: wrap">
  <section aria-label="消息列表" style="flex: 1 1 420px; min-width: 0; border-right: 1px solid #E5E7EB; background: #FFFFFF">
    <div role="tablist" aria-label="收件箱分类" style="display: flex; gap: 2px; padding: 10px 14px; border-bottom: 1px solid #E5E7EB">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <button type="button" role="tab" aria-selected="{{c.active}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
        <li><button type="button" onClick="{{it.open}}" style="{{it.style}}">
          <span style="display: flex; gap: 8px; align-items: center"><span style="font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #F3F4F6; color: #374151">{{it.kind}}</span><span style="font-size: 11px; color: #6B7280">{{it.where}}</span><span style="margin-left: auto; font-size: 11px; color: #6B7280">{{it.time}}</span></span>
          <span style="display: block; margin-top: 6px; font-size: 13px; color: #111827">{{it.title}}</span>
        </button></li>
      </sc-for>
    </ul>
  </section>
  <section aria-label="消息详情" style="flex: 1 1 420px; min-width: 0; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 12px; color: #6B7280">{{sel.kind}} · {{sel.where}}</div>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">{{sel.title}}</h1>
    <p style="margin: 0; line-height: 1.7; color: #374151">{{sel.body}}</p>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <a href="Main.dc.html" style="height: 32px; padding: 0 12px; border-radius: 6px; background: #1D4ED8; color: #FFFFFF; text-decoration: none; display: flex; align-items: center">在 Branch 中打开</a>
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid #D1D5DB; background: #FFFFFF">标为已读</button>
    </div>
  </section>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'all', sel: 0 }; }
  renderVals() {
    var s = this.state, self = this;
    var C = [['all','全部'],['review','评审请求'],['comment','评论'],['notice','通知']];
    var I = [
      ['review','评审请求','feat/relation-bfs','2 分钟前','PR #44 TASK-143 关系权重 请你评审','Agent A 提交了关系权重实现，验证 2/2 通过，等待人工闸门放行。'],
      ['comment','评论','TASK-142','15 分钟前','Agent B：自环判定已补，需要确认是否输出完整环路径','在任务卡 TASK-142 的讨论区回复即可，回复会同步到 Agent B 的会话。'],
      ['notice','通知','wt-context-cache','1 小时前','Worktree 已回退到 dev 基线','回退由 Router 触发，原因是缓存 TTL 测试连续失败 3 次。'],
      ['review','评审请求','fix/cache-ttl','3 小时前','fix/cache-ttl 有 2 处冲突待解决','冲突位于 cache.rs 两处，双方草稿已固定，可在画布关系图里对比。'],
      ['notice','通知','Physis / GVPE','昨天','LANE auth-refactor 进入 P6 测试阶段','IPA 看板显示 P5 实现已完成 4/15 个技能卡。']
    ];
    var list = I.map(function (x, i) { return { x: x, i: i }; }).filter(function (o) { return s.cat === 'all' || o.x[0] === s.cat; });
    var cur = I[s.sel];
    return {
      cats: C.map(function (c) { var on = s.cat === c[0]; return { label: c[1], active: on, pick: function () { self.setState({ cat: c[0] }); },
        style: 'border: 0; border-radius: 6px; height: 30px; padding: 0 12px; font-size: 12px; ' + (on ? 'background: #111827; color: #FFFFFF' : 'background: transparent; color: #4B5563') }; }),
      items: list.map(function (o) { var on = s.sel === o.i; return { kind: o.x[1], where: o.x[2], time: o.x[3], title: o.x[4], open: function () { self.setState({ sel: o.i }); },
        style: 'width: 100%; text-align: left; border: 0; border-bottom: 1px solid #F3F4F6; padding: 12px 14px; background: ' + (on ? '#EEF2FF' : '#FFFFFF') }; }),
      sel: { kind: cur[1], where: cur[2], title: cur[4], body: cur[5] }
    };
  }
}
</script>
</body>
</html>
