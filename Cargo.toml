    "crates/star-telemetry",
    # Phase G.10 (Exclusion & Idempotency) 启动: 2026-09-07 注册 crates/star-mutex (DomainMutex trait + VersionCAS + PgAdvisoryLock + LockAuditLogger, per 2026-09-07 21:43 JST 用户发令"启动,开子代理和worktree并行处理", 守门 #13 a L0 协调 + #13 c/d RLS 13 类 + audit 必携)
    "crates/star-mutex",
