exclude = ["target"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"  # T1.5 step 3/3 完成 (per WBS-001-refactor.md §1 T1.5): 全 workspace missing_docs 补全后 warn→deny
rust_2018_idioms = { level = "deny", priority = -1 }  # T1.5 step 2/3 完成
unreachable_pub = "deny"  # T1.5 step 1/3 (per WBS-001-refactor.md §1 T1.5): cargo check --workspace --lib -j 4 验证 0 err, 32.27s (per 9/3 AGENTS §4.1 v19 实证, -j 4 workaround 修正旧 "cargo workspace 互锁" 诊断)

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Star Team"]
license = "Apache-2.0"
repository = "https://github.com/UlyssesLeoLee/Star"

[workspace.dependencies]
# 异步运行时与异步 trait
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
# G-1 r2d2-memgraph (per WBS §14.15 跨 session 续, v0.81 落地 stub path)
r2d2 = "0.8"
# r2d2-memgraph = "0.1"  # TODO: 等 r2d2-memgraph crate 落地后启用 (G-1 完整实装)
# JWT 鉴权 (per §14.12 IV OAuth2 + JWT 拍板 2026-09-09 19:20 JST)
jsonwebtoken = "9"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP / 流式 (w21 http_client real-mode)
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
bytes = "1"
futures-util = "0.3"

# 错误
thiserror = "1"
anyhow = "1"

# ID / 时间
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# 数据库(Phase 2 使用,骨架阶段仅 workspace 声明,infrastructure crate 引用)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }

# Tracing
tracing = "0.1"

# Embedded key-value store (per ARG.2 OfflineQueue, 守门 #13 a W 派生)
sled = "0.34"

# 加密(Phase F webhook 签名验证使用)
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Regex (per OPT-NEXT-06-code-stub §3.4 domain-form + domain-search 实装)
regex = "1"

# Valkey / Redis client (per spec/cache/01 §2.3 + spec/cache/01 §2.3 选型决定 2026-09-10 23:41 JST)
# redis-rs 0.27+ 协议 100% 兼容 Valkey, tokio-comp + connection-manager features
# Phase G+ 启用于 crates/star-cache/src/valkey_backend.rs
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = 1
