[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/application",
    "crates/domain-agent",
    "crates/domain-audit",
    "crates/domain-automation",
    "crates/domain-batch",
    "crates/domain-board",
    "crates/domain-collaboration",
    "crates/domain-comment",
    "crates/domain-context",
    "crates/domain-development",
    "crates/domain-feedback",
    "crates/domain-identity",
    "crates/domain-integration",
    "crates/domain-kms",
    "crates/domain-local-runtime",
    "crates/domain-notification",
    "crates/domain-permission",
    "crates/domain-planning",
    "crates/domain-project",
    "crates/domain-relation",
    "crates/domain-scm",
    "crates/domain-search",
    "crates/domain-tenant",
    "crates/domain-theme",
    "crates/domain-validation",
    "crates/domain-work-item",
    "crates/domain-workflow",
    "crates/domain-workspace",
    "crates/domain-worktree",
    # Phase W11-14 (2026-08-29) 新增 4 crate
    "crates/domain-report",
    "crates/domain-dashboard",
    "crates/domain-form",
    "crates/domain-ai",
    # Phase W17-W20 (2026-08-29) 新增 2 crate
    "crates/domain-cli",
    "crates/domain-agent-windows",
    "crates/infrastructure",
    # Phase G 骨架:2026-08-28 新增 crates/star-cache (Cache 抽象 + InMemory + Redis stub)
    "crates/star-cache",
    # Phase D 骨架:2026-08-27 新增 3 crate
    "crates/star-cli",
    "crates/star-context",
    # Phase G 骨架:2026-08-27 新增 crates/star-saga (Saga orchestrator + Q-003 跨域协调)
    "crates/star-saga",
    "crates/star-mcp",
    # Phase F 骨架: 2026-08-27 新增 crates/star-sa (4 Git Provider)
    "crates/star-sa",
    # Phase F 骨架:2026-08-27 新增 2 crate (SSE + Webhook)
    "crates/star-sse",
    "crates/star-webhook",
    # Phase L 骨架: 2026-09-02 新增 crates/star-api-rest (Developer REST API, 22 路由 stub, 业务 P2 实装)
    "crates/star-api-rest",
    # RF-001 T1.3 落点: 2026-09-03 注册 crates/star-vcs (R-007 cache 层落点, 8/27 commit 48610ff2 落档 src/cache.rs 占位, 本 commit 新建 Cargo.toml + lib.rs)
    "crates/star-vcs",
    # Phase C.2 (T3.1) 启动: 2026-09-04 注册 crates/star-dto (跨域共享 DTO 类型, per HANDOFF-ST-001.md v0.8 §10, 跨 multi-sub-session 续)
    "crates/star-dto",
    # Phase G.1 (L0 派发 PoC) 启动: 2026-09-04 注册 crates/star-dispatcher (L0 派发层 + InMemory TaskQueue, per SRS-STAR-AGENT-RUNTIME-001 §G-1, v0.0.1 PoC stub)
    "crates/star-dispatcher",
    # Phase H.5 (Tree-sitter 引入) 启动: 2026-09-04 注册 crates/star-treesitter (5 语言 grammar + 符号提取, per `docs/architecture/2026-09-03-treesitter-worktree-graph/01-requirements.md` §1.4, v0.0.1 PoC)
    "crates/star-treesitter",
    # Phase H.6 (Task ↔ Worktree 1:1 绑定 + react-flow) 启动: 2026-09-04 注册 crates/star-taskgraph (TaskCard + Worktree + 1:1 binding + react-flow JSON 渲染, v0.0.1 PoC)
    "crates/star-taskgraph",
    # V2-1 (凭证管理层) 启动: 2026-09-04 注册 crates/star-credential (用户设置 UI 自填 → KMS 加密存储 → 运行时解密, 守门 #5 env 安全, 守门 #14 5 域 Lead CONTENT, 守门 #DB-13 W/T/M)
    "crates/star-credential",
]
exclude = ["target"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"  # T1.5 step 1/3 (per WBS-001-refactor.md §1 T1.5): cargo check --workspace --lib -j 4 验证 0 err, 32.27s (per 9/3 AGENTS §4.1 v19 实证, -j 4 workaround 修正旧 "cargo workspace 互锁" 诊断)

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Star Team"]
license = "Apache-2.0"
repository = "https://github.com/UlyssesLeoLee/Star"

[workspace.dependencies]
# 异步运行时与异步 trait
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP / 流式 (w21 http_client real-mode)
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
bytes = "1"
futures-util = "0.3"

# 错误
thiserror = "2"
anyhow = "1"

# ID / 时间
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# 数据库(Phase 2 使用,骨架阶段仅 workspace 声明,infrastructure crate 引用)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }

# Tracing
tracing = "0.1"

# 加密(Phase F webhook 签名验证使用)
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = 1
