    "crates/star-eventbus",
    # Phase G.5 (Tenant Quota) 启动: 2026-09-07 注册 crates/star-quota (compute / storage / LLM token 配额, 守门 #13 d M 派生 SCD Type 2 + 13 類 RLS)
    "crates/star-quota",
    # Phase G.6 (Memory Store) 启动: 2026-09-07 注册 crates/star-memory (短/长期 memory 分层, 守门 #13 W 短 TTL + T append-only 派生)
    "crates/star-memory",
    # Phase G.8 (Context Tiering) 启动: 2026-09-07 注册 crates/star-context-tiering (L0/L1/L2 上下文分层, per AGENTS §6.1)
    "crates/star-context-tiering",
