rust-version = "1.75"
authors = ["Star Team"]
license = "Apache-2.0"
repository = "https://github.com/UlyssesLeoLee/Star"

[workspace.dependencies]
# 异步运行时与异步 trait
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
# WebSocket HTTP server (per ULYS-222 P1-C — terminal-stack WebSocket protocol layer 依赖)
# 0.8 选型跟 crates/api 守门 #48 一致
axum = { version = "0.8", features = ["ws", "macros"] }
# tokio-stream for broadcast::Receiver Stream impl (per crates/api/arg/sse_hub 模式)
tokio-stream = "0.1"
# G-1 r2d2-memgraph (per WBS §14.15 跨 session 续, v0.81 落地 stub path)
r2d2 = "0.8"
# r2d2-memgraph = "0.1"  # TODO: 等 r2d2-memgraph crate 落地后启用 (G-1 完整实装)
# JWT 鉴权 (per §14.12 IV OAuth2 + JWT 拍板 2026-09-09 19:20 JST)
jsonwebtoken = "11"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP / 流式 (w21 http_client real-mode)
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
bytes = "1"
futures-util = "0.3"

# 错误
thiserror = "2"
anyhow = "1"

# ID / 时间
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# 数据库(Phase 2 使用,骨架阶段仅 workspace 声明,infrastructure crate 引用)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }

# Tracing
tracing = "0.1"

# Embedded key-value store (per ARG.2 OfflineQueue, 守门 #13 a W 派生)
sled = "0.34"

# 加密(Phase F webhook 签名验证使用)
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"

# Regex (per OPT-NEXT-06-code-stub §3.4 domain-form + domain-search 实装)
regex = "1"

# Serial test execution (per ULYS-194 9/24 rebase fix — env-var mutating tests 跨 #[tokio::test] 串行化)
serial_test = "3"

# Benchmark (per R9 阶段 3 5 milestone benchmark, per plan-032 §4.2)
criterion = { version = "0.8", features = ["html_reports"] }

# ECS (per R5 阶段 3 ECS 实际 + task lifecycle 集成, per plan-032 R5 阶段 3)
# hecs 选型: per 守门 v28 推荐项 hecs 轻量 ~50KB vs bevy_ecs 完整 ~500KB, PoC 阶段选 hecs (Rust 优先 + 简单 API + 单线程)
hecs = "0.11"

# Valkey / Redis client (per spec/cache/01 §2.3 + spec/cache/01 §2.3 选型决定 2026-09-10 23:41 JST)
# redis-rs 0.27+ 协议 100% 兼容 Valkey, tokio-comp + connection-manager features
# Phase G+ 启用于 crates/star-cache/src/valkey_backend.rs
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager"] }

# === ULYS-57.1 T1-T2 (2026-09-16) 新增 4 dep ===
# git2: libgit2 Rust binding (per DD-WORKTREE-CANVAS-001 §10 + D-GIT-001 + NFR-REL-001 Git 不可变)
# notify: cross-platform fs file watcher (per DD §11 Git Observer fsnotify)
git2 = "0.21"
notify = "8"
# tempfile: 测试用临时目录 (per 守门 #11 缺标比错标 — 阶段 1 测试用)
tempfile = "3"
# libgit2-sys 锁版本 (per issue 风险段: libgit2 跨平台差异 — 锁 libgit2-sys 0.18+)
libgit2-sys = "0.18"

# === ULYS-212 (A9 完善 — 真实 OS spawn 适配, FR-ORCA-001/004 + NFR-ORCA-001) ===
# process-wrap: 跨平台 process group / session / Job Object safe wrapper
# (ProcessSession = setsid + new group + leader; 用于 Linux setsid)
# v10 API: process-session feature 提供 ProcessSession struct + pre_spawn hook
process-wrap = { version = "10", default-features = false, features = ["std", "process-session"] }
# nix: Unix-only safe wrapper for libc::killpg / libc::setsid / signal 0 探测
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }
# win32job: Windows Job Object safe API (CreateJobObjectW / AssignProcessToJobObject / terminate)
win32job = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = 1
