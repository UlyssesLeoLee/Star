[package]
name = "worktree-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "AI Worktree Graph Canvas — Worktree Service: 9-method CRUD + 7-state machine + Health/Risk integration + 30-day Status Observed projection (ULYS-57.2 T3, per DD-WORKTREE-CANVAS-001 §12 + §23 + INV-WC-01/02/03/08/09)"

[lib]
name = "worktree_service"
path = "src/lib.rs"

[dependencies]
# 守门 #11 缺标比错标: 所有 dep 来自 [workspace.dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
# ULYS-195 stage 2 PR #4 — PG-backed `PgWorktreeService` (FR-ORCA-011).
# 用 `pg` feature 隔开, 避免强制每个 consumer 编译 sqlx (per 守门 #11 + #13 a/d 双 backend)
sqlx = { workspace = true, optional = true }

# 跨 crate 引用 (per WORKTREE-CANVAS-IMPL-PLAN-001 §3 集成策略)
# 单向依赖: worktree-service → graph-core + git-adapter + git-observer + worktree-shared-dir
graph-core = { path = "../graph-core" }
git-adapter = { path = "../git-adapter" }
git-observer = { path = "../git-observer" }
worktree-shared-dir = { path = "../worktree-shared-dir" }

[features]
# Per 守门 #11 + #13 a/d: 默认 off; 用 `cargo build -p worktree-service --features pg` 启用
default = []
pg = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true }
serial_test = { workspace = true }
# PG 集成测试依赖 (dev-dep, 不用 feature gating — `#![cfg(feature = "pg")]`
# 在测试文件顶部隔离了实际使用点, 让 sqlx 不进 default test 编译).
sqlx = { workspace = true }

[lints]
workspace = true
