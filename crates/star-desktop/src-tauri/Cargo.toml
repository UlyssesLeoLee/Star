[package]
# 2026-10-05 (per cargo-deny 实跑): 标记为 private, 使 cargo-deny 的
# allow-wildcard-paths 生效, 并允许恢复 bans.wildcards = "deny"。
# 本仓 crate 无 crates.io 发布意图。详见 PHASE-CD-SELECTION-REPORT.md §3 缺口 #6。
publish = false
name = "star-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Star Desktop — Tauri 2.0 + 1 page board (PoC P0, per docs/architecture/2026-09-29-upgrade/rust-app-end-research.md §3.2)"

[lib]
name = "star_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "star-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2.0 runtime
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# 复用现有 crates (守门 #19: 0 动业务 logic, 本 crate 新文件 adapter 仅用 enum/struct)
domain-board = { path = "../../../crates/domain-board" }
domain-worktree = { path = "../../../crates/domain-worktree" }
canvas-engine = { path = "../../../crates/canvas-engine" }
relationship-engine-wasm = { path = "../../../crates/relationship-engine-wasm" }

[lints]
workspace = true
