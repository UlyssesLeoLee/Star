[package]
# 2026-10-05 (per cargo-deny 实跑): 标记为 private, 使 cargo-deny 的
# allow-wildcard-paths 生效, 并允许恢复 bans.wildcards = "deny"。
# 本仓 crate 无 crates.io 发布意图。详见 PHASE-CD-SELECTION-REPORT.md §3 缺口 #6。
publish = false
name = "star-taskgraph"
version = "0.0.1"
edition = "2021"
description = "Star 仓 Task ↔ Worktree 1:1 绑定 + react-flow graph (per P4-H.6, 守门 #19 [P] 拍板)"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
star-treesitter = { path = "../star-treesitter" }
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
