[package]
name = "star-treesitter"
version = "0.0.1"
edition = "2021"
description = "Star 仓 Tree-sitter 集成 (per P4-H.5, 守门 #19 [M] 拍板) — Rust + 4 语言 grammar"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Tree-sitter 0.25.x (latest stable, Windows compatible)
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-json = "0.24"

[lints]
workspace = true
