[package]
name = "star-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "STAR Ops Console (MVP-骨架: 4 tab + 8 REST stub + Hybrid AI mock) — per docs/requirements/SRS-STAR-OPS-001.md v0.1"

[[bin]]
name = "star-ops"
path = "src/main.rs"

[lib]
name = "star_ops"
path = "src/lib.rs"

[dependencies]
# workspace 基础
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server (跟 star-mcp / star-api-rest 同版本)
axum = "0.8"

# HTTP client (F-02 真实 LLM 通道, OpenAI/Anthropic)
reqwest = { workspace = true }

# 凭证加密 (F-02 LLM API key 走 star-credential KMS, 守门 #5 v2)
star-credential = { path = "../star-credential" }

# Async trait for ops_ai::AiChannel
async-trait = { workspace = true }

# star-context ActorContext 复用 — 实装 [M] 子项时启用 (per AGENTS.md §4.2 v16),
# MVP-骨架阶段不引入 (per SRS-001 §3.2 "不做什么" 缺标比错标安全)

# F-01 端到端 (per SRS-001 §10.2): 仅 mock 路径 (subprocess 调 helm_canary_mock.sh),
# 不引入 kube crate (守門 #1 R-05 不动生产, kube 切生产 owner 拍板时再引).
# 修正 brief wt2 错误: 子代理 bg_27fc3bed 引入 kube 但 MVP 阶段不需要,
# owner 接手 amend 移除 (避免 k8s-openapi build failure + 守門 #1 禁回溯).
# kube = { version = "0.95" }  # 切生产 owner 拍板时启用

# F-04 文档扫描 (F-01 不动, 仅占位)
# walkdir = "2"

[dev-dependencies]
# axum::Router::oneshot 测试 helper (per star-mcp 模式)
tower = { version = "0.5", features = ["util"] }

# F-02 端到端 IT 雏形 (per 守门 #1 v25)
# axum::body::Body 测试用
# reqwest::Client IT 调 ops_api HTTP
# criterion bench (per 守门 #7 v3 PT 雏形 P95 < 200ms)
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "log_upload_bench"
harness = false

[lints]
workspace = true
