[package]
# 2026-10-05 (per cargo-deny 实跑): 标记为 private, 使 cargo-deny 的
# allow-wildcard-paths 生效, 并允许恢复 bans.wildcards = "deny"。
# 本仓 crate 无 crates.io 发布意图。详见 PHASE-CD-SELECTION-REPORT.md §3 缺口 #6。
publish = false
name = "star-credential"
version = "0.0.1"
edition = "2021"
description = "Star 仓凭证管理层 (per V2 阶段, 用户设置 UI 自填 → 后端加密 → 运行时解密, 守门 #5 env 安全 + 守门 #14 5 域 Lead CONTENT)"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync"] }
async-trait = "0.1"
axum = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { workspace = true }
domain-kms = { path = "../domain-kms" }
star-quota = { path = "../star-quota" }

[lints]
workspace = true
