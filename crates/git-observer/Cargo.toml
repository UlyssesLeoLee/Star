[package]
# 2026-10-05 (per cargo-deny 实跑): 标记为 private, 使 cargo-deny 的
# allow-wildcard-paths 生效, 并允许恢复 bans.wildcards = "deny"。
# 本仓 crate 无 crates.io 发布意图。详见 PHASE-CD-SELECTION-REPORT.md §3 缺口 #6。
publish = false
name = "git-observer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "AI Worktree Graph Canvas — Git Observer: fsnotify + 100ms debounce + 15 GitEvent (ULYS-57.1 T2, per DD-WORKTREE-CANVAS-001 §11 + NFR-REL-001)"

[lib]
name = "git_observer"
path = "src/lib.rs"

[dependencies]
# 守门 #11 缺标比错标: 所有 dep 来自 [workspace.dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }

# notify: cross-platform fs file watcher (per DD §11 Git Observer fsnotify)
notify = { workspace = true }
# tempfile: 测试用临时目录 (per 守门 #11 缺标比错标 — 阶段 1 测试用)
tempfile = { workspace = true }

# 跨 crate 引用: graph-core 提供 RepoId (per WORKTREE-CANVAS-IMPL-PLAN-001 §3 集成策略)
# 单向依赖: git-observer → graph-core
graph-core = { path = "../graph-core" }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true