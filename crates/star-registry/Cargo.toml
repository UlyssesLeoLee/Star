[package]
# 2026-10-05 (per cargo-deny 实跑): 标记为 private, 使 cargo-deny 的
# allow-wildcard-paths 生效, 并允许恢复 bans.wildcards = "deny"。
# 本仓 crate 无 crates.io 发布意图。详见 PHASE-CD-SELECTION-REPORT.md §3 缺口 #6。
publish = false
name = "star-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Star Multica Runtime Registry (R3 阶段 1: 5 provider 探测 + MinVersion gate + StatusClassifier 4 档 + LoginShellResolver 30min TTL, per ADR-0027 R3 + plan-032 R3)"

[dependencies]
# workspace inheritance (per 守门 #1 + #19, 避免 version 重复)
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "probe_1000_providers"
harness = false

[lints]
workspace = true
