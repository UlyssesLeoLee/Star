[package]
# 2026-11-16 (per cargo-deny 实跑一致化): 补 publish = false, 本仓 crate 无 crates.io 发布意图。
publish = false
name = "physis-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Physis GVPE physics engine WASM facade for Star 3D theme backdrop"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
wasm-bindgen = "0.2"
thiserror = { workspace = true }
bytemuck = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true
