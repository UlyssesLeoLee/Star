[package]
name = "physis-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Physis GVPE physics engine WASM facade for Star 3D theme backdrop"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
wasm-bindgen = "0.2"
thiserror = { workspace = true }
bytemuck = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true
