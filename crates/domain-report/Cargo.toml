[package]
# 2026-10-05 (per cargo-deny 实跑): 标记为 private, 使 cargo-deny 的
# allow-wildcard-paths 生效, 并允许恢复 bans.wildcards = "deny"。
# 本仓 crate 无 crates.io 发布意图。详见 PHASE-CD-SELECTION-REPORT.md §3 缺口 #6。
publish = false
name = "domain-report"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Star Team"]
license = "Apache-2.0"
description = "Star report engine: 22 report types (Burndown/Burnup/Velocity/CFD/Control/Cycle/Throughput/Forecast/TimeTracking/Resolution/SLA/CvR/Distribution/Workload/Version/Status/Heatmap/Recent) over work-item / sprint / version / project"
repository = "https://github.com/UlyssesLeoLee/Star"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
