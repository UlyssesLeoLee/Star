[package]
name = "action-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "AI Worktree Graph Canvas — Action Engine: 18 Action + 3 分类 + 二次确认 + Idempotency 24h + Audit SCD Type 2 + RBAC 5 角色 + Retry 3 档 (ULYS-57.3 T8, per DD-WORKTREE-CANVAS-001 §18 + §42-§44 + INV-WC-09/11/12)"

