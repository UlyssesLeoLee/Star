[package]
name = "domain-local-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# 基础依赖(全部 crate 共享)
serde = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
# w21 http_client 真实 HTTP (reqwest + SSE stream)
reqwest = { workspace = true, features = ["stream"] }
bytes = { workspace = true }
futures-util = { workspace = true }
# w25 sse_parser OpenAI JSON 解析
serde_json = { workspace = true }
# w22-w31 通用 tracing
tracing = { workspace = true }
# ULYS-156 cli_session_registry: rusqlite bundled SQLite WAL (per star-taskqueue 同款)
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }

star-context = { path = "../star-context" }
[dev-dependencies]
tokio = { workspace = true }
# ULYS-156 P0-A 续 cli_session_lock file mode 测试需要 tempfile
tempfile = "3"

[lints]
workspace = true
