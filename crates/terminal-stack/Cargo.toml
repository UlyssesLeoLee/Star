[package]
name = "terminal-stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Star Terminal Stack — scrollback ring buffer + split-pane tree (per ULYS-200 + FR-ORCA-036/039 §12 v1.0 + 终端栈选型 = 候选 B per 2026-09-22 JST 决策)"

[lib]
name = "terminal_stack"
path = "src/lib.rs"

[dependencies]
# 守门 #11 缺标比错标: 所有 dep 来自 [workspace.dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# async-trait per ULYS-222 P1-C (handler.rs / integration.rs / protocol.rs trait seam)
async-trait = { workspace = true }
# tokio 在 [workspace.dependencies] 已带 full features (per crates/api 守门 #48);
# WebSocket 层引入 tokio runtime primitives (broadcast / mpsc / select), 故加 tokio workspace dep.
tokio = { workspace = true }
# axum 0.8 WebSocket HTTP server (per ULYS-222 P1-C handler.rs)
axum = { workspace = true }
# tokio-stream for broadcast::Receiver Stream impl
tokio-stream = { workspace = true }
# tracing per ULYS-232 P1-E demo_server observability
tracing = { workspace = true }
# P1-E demo_server bin needs tracing-subscriber for tracing init (per AC-6 observability)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ULYS-220 P1-A Persistence: rusqlite bundled SQLite WAL (per cli_session_registry / star-taskqueue 同款)
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
# P1-E cargo bench (per NFR-PERF-002)
criterion = { workspace = true }

[[bench]]
name = "p1e_bench"
harness = false

[lints]
workspace = true