[package]
name = "domain-form"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Star Team"]
license = "Apache-2.0"
description = "Star form engine: 12 field types, conditional logic, submit actions, public form URL"
repository = "https://github.com/UlyssesLeoLee/Star"

[lints.rust]
