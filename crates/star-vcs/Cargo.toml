[package]
# 2026-10-05 (per cargo-deny 实跑): 标记为 private, 使 cargo-deny 的
# allow-wildcard-paths 生效, 并允许恢复 bans.wildcards = "deny"。
# 本仓 crate 无 crates.io 发布意图。详见 PHASE-CD-SELECTION-REPORT.md §3 缺口 #6。
publish = false
name = "star-vcs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "STAR VCS — Version Control Provider 抽象 + cache 层 (R-007 落点, per acceptance/08 v0.2 fix 2026-08-27)"

[lib]
name = "star_vcs"
path = "src/lib.rs"

[dependencies]
# R-007 cache 层实装 (per OPT-CODE-68 + brief OPT-WORKER-02)
# - tokio: 异步运行时 (RwLock / sleep / test runtime)
# - async-trait: 异步 trait 宏 (VcsCache / VcsProvider)
# - thiserror: CacheError 派生 (4 变体)
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
