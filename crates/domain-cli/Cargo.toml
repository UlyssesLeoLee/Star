[package]
name = "domain-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Star Team"]
license = "Apache-2.0"
description = "Star CLI agent registry: 6 built-in (claude/codex/openclaw/hermes/gemini/aider) + custom profiles + dual-mode API key (encrypted Rust or env) + CLI spawn and HTTP API agent abstractions"
repository = "https://github.com/UlyssesLeoLee/Star"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = "warn"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
# 加密 (AES-256-GCM for API Key)
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
# HTTP 客户端 (B.6 Hermes HTTP 客户端实装, per 2026-08-30 07:28 JST wt-b6-hermes-mock)
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
