[package]
# 2026-10-05 (per cargo-deny 实跑): 标记为 private, 使 cargo-deny 的
# allow-wildcard-paths 生效, 并允许恢复 bans.wildcards = "deny"。
# 本仓 crate 无 crates.io 发布意图。详见 PHASE-CD-SELECTION-REPORT.md §3 缺口 #6。
publish = false
name = "domain-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Star Team"]
license = "Apache-2.0"
description = "Star CLI agent registry: 6 built-in (claude/codex/openclaw/hermes/gemini/aider) + custom profiles + dual-mode API key (encrypted Rust or env) + CLI spawn and HTTP API agent abstractions"
repository = "https://github.com/UlyssesLeoLee/Star"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
# 加密 (AES-256-GCM for API Key)
aes-gcm = "0.11"
base64 = "0.23"
rand = "0.10"
# HTTP 客户端 (B.1 OpenClaw + B.6 Hermes HTTP 客户端实装, per 2026-08-30 07:25 / 07:28 JST)
reqwest = { workspace = true }

star-context = { path = "../star-context" }
[dev-dependencies]
tokio = { workspace = true }
# B.2 Hermes wiremock contract test (per 29692a7 mock 备选路径实装, 2026-09-01 22:30 JST)
wiremock = "0.6"
