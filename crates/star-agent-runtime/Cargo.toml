[package]
name = "star-agent-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
description = "STAR Agent Runtime ECS skeleton (WBS 6.2) — Agent-oriented minimal ECS + Runtime 双模式, per SRS-STAR-AGENT-RUNTIME-001 + docs/architecture/2026-09-03-agent-runtime/"
license = "Apache-2.0"

# 2026-11-14: 已注册进根 Cargo.toml workspace members (merge 收尾时追加, 见根 Cargo.toml WBS 6.2 注释)。
# 原独立 [workspace] 段已移除 (嵌套 workspace 会让 cargo metadata 失败)。

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[dependencies]
# 骨架 std-only (0 依赖): 组件/状态机/模式管理/调度/反压/限流/重试全同步纯逻辑,
# 无需 tokio/bevy (per TASK 落地原则: 依赖过重 → 骨架 + 接口 + 测试)。
# 后续 P3-B 选型 (bevy_ecs / flecs, per 03-DD §1.3) 时替换 ecs.rs 存储层。
