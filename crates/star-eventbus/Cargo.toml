[package]
name = "star-eventbus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "STAR EventBus + Mailbox (Phase G.3) — in-process pub/sub + at-most-once / at-least-once / exactly-once"

# G.3 (per `docs/briefs/next-session/OPT-NEXT-04-phase-g.md` §3.3):
# - in-process pub/sub (tokio mpsc 通道)
# - Mailbox 3 模式: at-most-once / at-least-once / exactly-once
# - 跨进程 via Valkey stream (Phase G+ stub) — 选型替代 Redis (per docs/operation-design.md §4.4)
# 守门 #13 a L0 协调 派生: 事件 bus 是 L0 协调设施, 不允许 L1↔L1 直连 (per TMO-03 实证)

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
# Valkey / Redis client (per spec/cache/01 §2.3 选型决定 redis-rs 0.27+
# + Phase G+ 跨进程 EventBus 实装; 选型对齐 star-cache/valkey_backend.rs)
# workspace dep 已 default-features = false, 这里 +streams 启用 XADD/XREAD
redis = { workspace = true, features = ["streams"] }

[lints]
workspace = true
