[package]
# 2026-10-05 (per cargo-deny 实跑): 标记为 private, 使 cargo-deny 的
# allow-wildcard-paths 生效, 并允许恢复 bans.wildcards = "deny"。
# 本仓 crate 无 crates.io 发布意图。详见 PHASE-CD-SELECTION-REPORT.md §3 缺口 #6。
publish = false
name = "domain-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# 基础依赖(全部 crate 共享)
serde = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }

star-context = { path = "../star-context" }
# ULYS-98 v1.0.1 follow-up: ai_session_inline (W4.3) uses domain_llm + serde_json
# per docs/specs/star-cursor-min-spec.md section 1.4 Agent API.
# 守门 #11 缺标比错标: 0 重复加 serde/tokio/uuid/chrono/async-trait/thiserror/star-context.
domain-llm = { path = "../domain-llm" }
serde_json = { workspace = true }
sha2 = { workspace = true }
# ULYS-204 PI-3 (per SRS-PI-BORROW-001 §4 FR-16): loop_boundary::default_stream_fn
# returns Pin<Box<dyn Stream<Item = AgentStreamEvent> + Send>> -- needs futures-util
# for `stream::once` + `stream::iter` + `StreamExt::flat_map` adapters.
futures-util = { workspace = true }
# ULYS-207 PI-9 W5 (commit `536a830a`): CollabSteeringCommand 真实字段
# tool_hint: domain_tool::ToolExecutionMode (PI-4 ship, ULYS-205 0b00ecec)
# payload_op: star_dto::delta::Op (PI-6 ship, ULYS-206 2a0ca91a)
domain-tool = { path = "../domain-tool" }
star-dto = { path = "../star-dto" }
[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
