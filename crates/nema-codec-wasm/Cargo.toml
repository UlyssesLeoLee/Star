[package]
# 2026-11-16 (per cargo-deny bans.wildcards 实跑): 补 publish = false。
# nema-codec 为 path 依赖 (无 version), 公开 crate 会触发 wildcard 拒绝。
publish = false
name = "nema-codec-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
description = "NEMA v1.5 codec — wasm-bindgen bindings for frontend (移植自 IDE1.0 MIT 授权)"

[lints]
workspace = true

[dependencies]
nema-codec = { path = "../nema-codec" }
wasm-bindgen = "0.2"
serde_json.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
