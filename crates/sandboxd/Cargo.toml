[package]
# sandboxd — Sandbox-as-a-Service 独立 daemon (WBS 6.5.2, per SRS-SANDBOX-002 / BD-SANDBOX-002 / DD-SANDBOX-002)
# 2026-11-14 (per cargo-deny 实跑): 标记为 private, 本仓 crate 无 crates.io 发布意图。
publish = false
name = "sandboxd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sandbox-as-a-Service daemon — gRPC IPC + 4 维隔离 (resource/network/fs/capability) + session 池化 (per SANDBOX-002)"

[[bin]]
name = "sandboxd"
path = "src/bin/sandboxd.rs"

[dependencies]
# 跨 crate 复用 (跟 mavis 现有 workspace 一致, per 守门 #11 缺标比错标)
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { workspace = true, features = ["sync"] }
futures-util = { workspace = true }
async-trait = { workspace = true }

# gRPC (per TASK.md 关键决策: tonic 0.12 + prost 0.13, 已拍板不重议)
tonic = "0.14"
prost = "0.14"

# HTTP (用于 /metrics + /healthz, axum 0.8 跟 workspace 一致)
axum = { workspace = true }

# Metrics (per FR-6.1, 9 sandboxd 指标)
prometheus = "0.14"

# Config (per FR-1.1, YAML 配置文件)
serde_yaml = "0.9"

# session 池并发容器 (per DD §2.1 Orchestrator.sessions)
dashmap = "6"

# Network policy CIDR 匹配 (per BD §2.1 policy::network 依赖清单)
ipnet = "2"

# DB (PG audit log, per FR-6.2 + 守门 #13 W/T/M, 跟 p3d6_audit 表结构一致)
sqlx = { workspace = true }

# 平台特定 (per FR-5)
# Windows: Job Objects 走 win32job safe wrapper (0 unsafe, per 守门 #7)
[target.'cfg(windows)'.dependencies]
win32job = { workspace = true }

[build-dependencies]
tonic-build = "0.14"
# protoc 二进制 vendored (per crates/platform-messaging-proto 同款, 不依赖系统 protoc)
protoc-bin-vendored = "3.3"

[dev-dependencies]
tempfile = { workspace = true }

# 测试目标 (per DD-SANDBOX-002 §1.1 tests/ 布局; 嵌套目录需显式注册)
[[test]]
name = "test_config"
path = "tests/unit/test_config.rs"

[[test]]
name = "test_policy_resource"
path = "tests/unit/test_policy_resource.rs"

[[test]]
name = "test_policy_network"
path = "tests/unit/test_policy_network.rs"

[[test]]
name = "test_policy_fs"
path = "tests/unit/test_policy_fs.rs"

[[test]]
name = "test_policy_capability"
path = "tests/unit/test_policy_capability.rs"

[[test]]
name = "test_orchestrator"
path = "tests/unit/test_orchestrator.rs"

[[test]]
name = "test_metrics"
path = "tests/unit/test_metrics.rs"

[[test]]
name = "test_audit"
path = "tests/unit/test_audit.rs"

[[test]]
name = "test_backend_linux"
path = "tests/unit/test_backend_linux.rs"

[[test]]
name = "test_backend_macos"
path = "tests/unit/test_backend_macos.rs"

[[test]]
name = "test_grpc_create_run_destroy"
path = "tests/integration/test_grpc_create_run_destroy.rs"

[[test]]
name = "test_failover_v02_subprocess"
path = "tests/integration/test_failover_v02_subprocess.rs"

[[test]]
name = "test_pg_audit_persistence"
path = "tests/integration/test_pg_audit_persistence.rs"

[[test]]
name = "test_backend_smoke"
path = "tests/integration/test_backend_smoke.rs"

[[test]]
name = "test_dispatcher_integration"
path = "tests/e2e/test_dispatcher_integration.rs"

[lints]
workspace = true
