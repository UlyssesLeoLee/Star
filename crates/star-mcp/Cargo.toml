[package]
name = "star-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "STAR MCP server — Phase D.5+ (stdio + Streamable HTTP + Resources + Prompts)"

[[bin]]
name = "star-mcp"
path = "src/main.rs"

[dependencies]
# workspace 已有依赖
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Phase H: 22 domain Resource trait (per spec/mcp/02 §2 + spec/agents/02 §2.2)
async-trait = { workspace = true }
# Phase D.5+:Streamable HTTP transport (per 2025-06-27 MCP spec)
axum = "0.8"
tokio-stream = "0.1"
# Phase D 骨架:不引入 rmcp(避免 beta 风险,per spec §1 transport 选择)
# MCP transport 由 D.3 (stdio) + D.5+ (Streamable HTTP) 自行实装, 不依赖 rmcp

# Phase B.2 (Tier 1 试水): 真实数据源接入 tenant / identity / permission
domain-tenant = { path = "../domain-tenant" }
domain-identity = { path = "../domain-identity" }
domain-permission = { path = "../domain-permission" }
# Phase B.2.5 (Tier 2): 真实数据源接入 workspace / project / work-item
domain-workspace = { path = "../domain-workspace" }
domain-project = { path = "../domain-project" }
domain-work-item = { path = "../domain-work-item" }
# Phase B.2.6 (Tier 3): 真实数据源接入 worktree / agent / feedback
# (domain-decision crate 缺失 per spec/integration/01 §6 已知缺口,待创建)
domain-worktree = { path = "../domain-worktree" }
domain-agent = { path = "../domain-agent" }
domain-feedback = { path = "../domain-feedback" }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# axum::Router::oneshot 测试 helper (per transport_http.rs tests)
tower = { version = "0.5", features = ["util"] }
# P0-1 跨 crate IT (it_actor_context_integration.rs)
star-context = { path = "../star-context" }

[lints]
workspace = true
