[package]
publish = false
name = "platform-messaging-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["jetstream-adapter"]
durable-quarantine = []
jetstream-adapter = [
    "durable-quarantine",
    "dep:async-nats",
    "dep:base64",
    "dep:domain-kms",
    "dep:futures-util",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
async-nats = { workspace = true, optional = true, features = ["server_2_10"] }
futures-util = { workspace = true, optional = true }
base64 = { version = "0.23", optional = true }
chrono = { workspace = true }
domain-kms = { path = "../domain-kms", optional = true }
domain-automation = { path = "../domain-automation" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
