# SPDX-License-Identifier: MIT OR Apache-2.0
# `bff` — STAR BFF (Backend for Frontend) workspace (P3-D.6 阶段 1 基础 任务 1.5)
#
# 跟 `crates/api` 平级 (BFF vs API), 通过 `svc://` 引用业务 svc (per 9/1 13:05 JST
# envoy 独立 deployment 偏好). 0 反向依赖 (BFF 调 API, API 不依赖 BFF).
#
# ULYS-57.4 (2026-09-17) 新增 `worktree_canvas` feature flag — T13 BFF module
# (`bff/src/worktree_canvas/`) + 11 REST + 15 SSE + 1 WS endpoint + RBAC +
# Idempotency + Audit 包装 (per DD-WORKTREE-CANVAS-001 §20-§21 +
# WORKTREE-CANVAS-IMPL-PLAN-001 §4.13 + spec §4.4 §4.5).
#
# 守门合规 (per 守门 #1 v25 + 守门 #7 + 守门 #11 + 守门 #14 v2 + 守门 #19 v19):
# - 0 改根 `Cargo.toml` [workspace] members 任何行 (bff 是新独立 workspace).
# - 0 改 `crates/api/Cargo.toml` 任何行 (0 添加 bff 依赖, BFF 跟 API 平级 0 反向依赖).
# - axum / tokio-tungstenite 用具体 version 0.8 / 0.21 (0 重复加到根 [workspace.dependencies]).
# - `worktree_canvas` feature 隔离新 BFF 模块; 0 feature = V0.1 collab only (守门 #19 v19).
# - graph-core / git-adapter / git-observer 走 path 依赖, 0 重复加 [workspace.dependencies].
# - 5 域 Lead 真人到位前 Mavis 临时代签 (per 守门 #14 v2 拍板 D, 2026-09-05 10:43 JST).
# 空 [workspace] 标记 bff 跟根 workspace 0 关系 (独立 workspace, 0 改根 [workspace.members],
# 跟 tools/ frontend/ 模式一致, per 守门 #1 禁回溯叙事 + 守门 #11 缺标比错标).
[workspace]

[package]
name = "bff"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Star Team"]
repository = "https://github.com/UlyssesLeoLee/Star"
description = "STAR BFF (Backend for Frontend) — envoy 独立 deployment, collab (V0.1) + worktree-canvas (V0.2, feature-gated)"
publish = false

# NOTE: bff is single-crate, no [workspace] section needed. 跨 session 续:
# 当 bff 子 crate (e.g. bff-worktree-canvas 独立 crate) 加入时, 加
# [workspace] members = ["."] 即可, 当前阶段 0 子 crate.

[features]
# 守门 #19 v19: V0.1 collab 不动; `worktree_canvas` feature 默认开启 (per
# brief §"完成标准 #1 BFF module 编译通过"), 0 feature 走 `--no-default-features`
# 仅 V0.1 collab 用于回归。
default = ["worktree_canvas", "cursor"]
worktree_canvas = [
    "dep:graph-core",
    "dep:git-adapter",
    "dep:git-observer",
    "dep:tokio-stream",
    "dep:futures-util",
    "dep:async-stream",
]

# ULYS-98-W3 (2026-10-05) Star Cursor 极简版 — cursor 极简版模块 (per
# docs/briefs/ulys-98-star-cursor-min-v1.md §"Sub-task 3.1/3.2/3.4/3.6"):
# 4 REST + 2 SSE 端点 (POST /v1/chat/sessions + POST /v1/chat/send + GET /v1/chat/messages +
# GET /v1/chat/stream + POST /v1/composer/edit + GET /v1/rag/search) + RAG 上下文检索 +
# ChatSession in-memory repository (per 守门 #19 v19 阶段 1 占位模式). feature-gated 隔离:
# 0 feature 走 V0.1 collab 仅 V0.1 回归守门, 加 feature 默认开启 (per W3 Gate "cargo
# check --workspace --all-targets -j 4 0 错误").
#
# 守门合规 (per 守门 #1 v25 + 守门 #7 + 守门 #11 + 守门 #14 v2 + 守门 #19 v19):
# - 0 改根 Cargo.toml [workspace] members 任何行 (bff 是新独立 workspace).
# - domain-llm 是新 path 依赖 (per W3.6 RAG), 0 重复加 [workspace.dependencies].
# - 0 改 crates/api/Cargo.toml 任何行 (0 添加 bff 依赖, BFF 跟 API 平级 0 反向依赖).
# - cursor feature 隔离新 BFF 模块; 0 feature = V0.1 collab only (守门 #19 v19).
cursor = [
    "dep:domain-llm",
    "dep:tokio-stream",
    "dep:futures-util",
    "dep:async-stream",
]

[dependencies]

# HTTP / WebSocket (per brief §2.1, axum 0.8 + features ws / macros, 跟 crates/api 一致)
axum = { version = "0.8", features = ["ws", "macros"] }

# 异步运行时 (per 根 [workspace.dependencies] 现有 tokio 1.40, 跟 crates/api 一致)
tokio = { version = "1.40", features = ["full"] }
# 可选 dep, 仅 `worktree_canvas` feature 用 (per ULYS-57.4 T13.3 15 SSE 端点)
tokio-stream = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# async-trait + thiserror (跟根 [workspace.dependencies] 一致)
async-trait = "0.1"
thiserror = "1"

# ID / 时间 (跟根 [workspace.dependencies] 一致)
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# 跨 crate path 依赖 (per brief §1.1 范围内 + §2.1)
# 守门 #1 禁回溯叙事: 0 改根 Cargo.toml [workspace] members 任何行 (bff 是新独立 workspace, 不需要注册)
# 守门 #11 缺标比错标: star-context / canvas-collab / arg-bridge / api 4 path 依赖, 0 重复加
# 注: crates/api package name = "api" (非 "star-api"), crates/arg-bridge package name = "star-arg-bridge" (per root Cargo.toml)
star-context = { path = "../crates/star-context" }
canvas-collab = { path = "../crates/canvas-collab" }
star-arg-bridge = { path = "../crates/arg-bridge" }
api = { path = "../crates/api" }

# ULYS-57.4 (2026-09-17) 3 新增 path 依赖 (仅 worktree_canvas feature 用)
# 守门 #11: 0 重复加 [workspace.dependencies] (graph-core/git-adapter/git-observer 是新 crate, per 57.1 T1+T2)
graph-core = { path = "../crates/graph-core", optional = true }
git-adapter = { path = "../crates/git-adapter", optional = true }
git-observer = { path = "../crates/git-observer", optional = true }

# ULYS-98-W3 (2026-10-05) 新增 path 依赖 (仅 cursor feature 用, per W3.6 RAG 调用
# domain_llm::context::ContextBuilder + W3.1 chat session model DTOs re-export)
# 守门 #11: domain-llm 是新 crate, 0 重复加 [workspace.dependencies].
domain-llm = { path = "../crates/domain-llm", optional = true }

[dev-dependencies]
# ULYS-98-W1 chat routes use ServiceExt::oneshot for handler unit tests.
tower = { version = "0.5", features = ["util"] }

[lints.rust]
# 0 unsafe blocks (per 守门 #7 `unsafe_code = "forbid"`).
unsafe_code = "forbid"
# 阶段 1 基础 missing_docs = warn (0 deny, 跟 crates/api 一致, 阶段 2 业务实装阶段升 deny)
missing_docs = "warn"
# 跨 session 续的 idiom 严格
rust_2018_idioms = { level = "deny", priority = -1 }
# 阶段 1 基础 unreachable_pub = warn (0 deny, 跟 crates/api V0.1 一致, 阶段 2 业务实装阶段升 deny)
unreachable_pub = "warn"
